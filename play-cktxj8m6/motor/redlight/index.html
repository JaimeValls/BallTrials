<script>
/*+AG ?drive=1 (verificacion DOM/JS, docs/34): cuando el pane/iframe NO compone frames, el rAF nativo nunca
   dispara y el juego no avanza. Este script CLASICO (corre ANTES que el modulo) encola los callbacks de rAF
   y falsea performance.now; window.__driveFrames(n) bombea n frames sinteticos a 60fps desde consola/tests.
   Sin ?drive=1 es un no-op total. NO toca la Sim ni el determinismo (solo el reloj del render). */
if(new URLSearchParams(location.search).get('drive')==='1'){
  window.__rafQ=[]; window.__drvT=1000;
  window.requestAnimationFrame=function(cb){ window.__rafQ.push(cb); return window.__rafQ.length; };
  window.cancelAnimationFrame=function(){};
  performance.now=function(){ return window.__drvT; };
  window.__driveFrames=function(n){ for(var i=0;i<n;i++){ window.__drvT+=1000/60; var q=window.__rafQ.splice(0); for(var k=0;k<q.length;k++){ q[k](window.__drvT); } } return window.__drvT; };
}
</script>

// ---- CÁMARA DEL SHORT 9:16: ENCUADRE AL GRUPO (2026-07-19) ----------------------------------------------------
// Qué pasaba: el short heredaba el encuadre del torneo, que se pide "por ancho" (FIELD_W*1.70 = 44 u). En 16:9 eso
// deja 25 u de alto = zoom real (se ve medio campo y la cámara persigue al pelotón). En 9:16 el MISMO margen se
// traduce en 78 u de ALTO para una pista de 48 → cabía el mapa entero y sobraba medio frame vacío.
// Qué NO funciona: recortar a una ventana FIJA y estrecha centrada en la media del pelotón. Las bolas se pegan a
// LOS DOS muros a la vez para esquivar los boulders (medido: x = -12.6 … +11.5) → frames enteros sin ninguna bola.
// Lo que sí (y es lo que hace la cámara de 16:9): ENCUADRAR LA CAJA del pelotón vivo con margen y dejar que el
// zoom respire — cerca cuando van juntas, abierta cuando se separan. Medido sobre 30 semillas: el pelotón ocupa
// ≤12 u de ancho en el 60% de los frames y ≤18 u en el 87% → la mayor parte del short se ve DE CERCA de verdad.
// Reglas del suavizado (nunca marear, nunca perder una bola):
//   · ABRIR es rápido (una bola que se escapa entra en plano ya), CERRAR es lento (no hay bombeo de zoom).
//   · La caja SIEMPRE cabe: el ancho pedido sale del máximo entre caja-en-X y caja-en-Y convertida a 9:16.
//   · Clamp a los muros: con ancho < FIELD_W la cámara nunca enseña fuera de pista.
// Márgenes APRETADOS (feedback del dueño 2026-07-20: "sobra espacio, podría hacer más zoom in"): la parrilla de
// salida ocupa 9 u (4 columnas × 3.0) y con los márgenes anteriores el arranque salía a 18 u. Con maxW < FIELD_W,
// en el tramo en que se pegan a los DOS muros la bola más extrema queda medio cortada por el borde: preferible a
// alejar la cámara los 25 s restantes (y el muro no tiene nada que enseñar).

// ---- damero de la LÍNEA DE META ------------------------------------------------------------------------------
// v8 (feedback del dueño 2026-07-19: "la línea de meta parece una barrera"): antes era una tira de 0.6 u con un
// damero diminuto → a distancia se leía como un listón más, indistinguible de la barrera rompible. Ahora es una
// BANDA ANCHA (2.4 u) de dos filas de cuadros GRANDES (~1.2 u de lado, el tamaño de una bola y media), que es
// como se lee una meta de un vistazo. El damero se dibuja con la geometría, no con repeat de textura, para que
// los cuadros midan lo mismo en unidades de mundo pase lo que pase con el zoom.
const GATE_DEPTH = 2.4, GATE_SQ = 1.2;                  // profundidad de la banda y lado del cuadro (unidades)
function checkerBand(widthU, depthU, sq){
  const cols = Math.max(2, Math.round(widthU/sq)), rows = Math.max(2, Math.round(depthU/sq));
  const c=document.createElement('canvas'); c.width=cols*16; c.height=rows*16; const x=c.getContext('2d');
  for(let r=0;r<rows;r++) for(let i=0;i<cols;i++){ x.fillStyle=((i+r)&1)?'#101010':'#f7f7f7'; x.fillRect(i*16,r*16,16,16); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.magFilter=THREE.NearestFilter; return t; }

// ---- PISTA v7.1: terracota PLANA con un brillo suave central (vignette, SIN líneas horizontales → se lee claro
//      qué es área jugable). Feedback del dueño: menos líneas, más plano pero bonito. ----
function trackTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  const g=x.createRadialGradient(128,110,20,128,128,180); g.addColorStop(0,ART.track[1]); g.addColorStop(1,ART.track[0]);
  x.fillStyle=g; x.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return crispen(t); }
function bannerTex(dir){ const c=document.createElement('canvas'); c.width=64;c.height=64; const x=c.getContext('2d');
  const cols=ART.banner; for(let i=0;i<4;i++){ x.fillStyle=cols[i%cols.length]; const y=i*16;
    x.beginPath(); if(dir>0){ x.moveTo(0,y); x.lineTo(0,y+16); x.lineTo(52,y+8); } else { x.moveTo(64,y); x.lineTo(64,y+16); x.lineTo(12,y+8); }
    x.closePath(); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapT=THREE.RepeatWrapping; return t; }

// ---- arena estática: suelo (delantal + pista), muros, banderines, zona de meta ----
{ const EXT_Y=FIELD_L+44, EXT_X=FIELD_W+26;   // suelo MUY holgado → al scrollar/temblar los bordes NUNCA muestran fondo negro

  if(ARTV){ const track=new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W,EXT_Y),new THREE.MeshStandardMaterial({map:trackTex(),roughness:0.72,metalness:0.0}));
    track.position.set(0,FIELD_L/2,-0.45); scene.add(track);     // PISTA terracota PLANA (área jugable, entre los muros)
    // BORDILLOS crema: dos líneas VERTICALES que delimitan claramente la calle jugable del delantal

    for(const sx of [-1,1]){ const cb=new THREE.Mesh(new THREE.PlaneGeometry(0.28,EXT_Y),curbMat); cb.position.set(sx*(FIELD_W/2-0.2),FIELD_L/2,-0.4); scene.add(cb); } }
  const wl=new THREE.Mesh(new THREE.BoxGeometry(0.5,EXT_Y,1.2),matWall); wl.position.set(XL-0.25,FIELD_L/2,0); scene.add(wl);
  const wr=new THREE.Mesh(new THREE.BoxGeometry(0.5,EXT_Y,1.2),matWall); wr.position.set(XR+0.25,FIELD_L/2,0); scene.add(wr);
  // línea de meta (damero) + zona segura (v7: DORADA, libera el verde para el semáforo; v5 era verde)
  // META: banda de damero ANCHA centrada en la línea de cruce (GATE_Y) + un filo dorado a cada lado que la
  // separa del asfalto (así no se confunde con la barrera ni con los bloqueadores rayados).
  const gate=new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W,GATE_DEPTH),
    new THREE.MeshBasicMaterial({map:checkerBand(FIELD_W,GATE_DEPTH,GATE_SQ),toneMapped:false}));
  gate.position.set(0,GATE_Y,0.1); scene.add(gate);

}

// ---- obstáculos (meshes; se colocan leyendo la sim) ----
let mineM=[], blockerM=[], barrierM=[], boulderM=[], popPool=[];

// MINA: se lee como "no pares aquí". Dibujada UNA vez en un canvas (pinchos + cuerpo + núcleo rojo) y compartida
// como TEXTURA en todas → 2 meshes por mina (sprite + halo) en vez de ~12 → mucho menos coste de render.
function mineTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'); const C=128;
  const spike=ARTV?ART.mineSpike:'#aab2c0', body=ARTV?ART.mineBody:'#2b2f3a', ring=ARTV?ART.mineRing:'#5b6474';
  x.strokeStyle=spike; x.lineWidth=18; x.lineCap='round';   // 8 pinchos (2× resolución → nítidos)
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; x.beginPath(); x.moveTo(C+Math.cos(a)*60,C+Math.sin(a)*60); x.lineTo(C+Math.cos(a)*104,C+Math.sin(a)*104); x.stroke(); }
  x.fillStyle=body; x.beginPath(); x.arc(C,C,68,0,7); x.fill();                     // cuerpo
  x.strokeStyle=ring; x.lineWidth=12; x.beginPath(); x.arc(C,C,58,0,7); x.stroke(); // aro
  x.fillStyle='#5a1216'; x.beginPath(); x.arc(C,C,30,0,7); x.fill();                 // núcleo oscuro (se queda)
  x.fillStyle='#ff3a28'; x.beginPath(); x.arc(C,C,14,0,7); x.fill();                 // luz ROJA (señal: se queda)
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return crispen(t); }
const MINE_TEX=mineTex();
const matMineSprite=new THREE.MeshBasicMaterial({ map:MINE_TEX, transparent:true, depthWrite:false, toneMapped:false });
function mineMesh(){ const g=new THREE.Group();
  const sprite=new THREE.Mesh(new THREE.PlaneGeometry(2.1,2.1), matMineSprite); sprite.position.z=0.05; g.add(sprite);
  const glow=new THREE.Mesh(new THREE.CircleGeometry(1.0,16), new THREE.MeshBasicMaterial({color:DANGER,toneMapped:false,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false})); glow.position.z=0.04; glow.layers.enable(BLOOM); g.add(glow);
  g.userData={glow}; return g; }

// texturas de aviso/ladrillo horneadas UNA vez y compartidas (sin clonar; el clon era el "artefacto negro")
// RAYAS DE PELIGRO (bloqueador): alta resolución + SEAMLESS + se TESELA (no se estira) → nítidas a cualquier ancho.
function stripeTex(){ const S=256; const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
  x.fillStyle=ARTV?ART.chevronBg:'#4a5262'; x.fillRect(0,0,S,S);
  x.strokeStyle=ARTV?ART.chevron:'#e8b41e'; x.lineWidth=S*0.28; x.lineCap='butt';
  for(let i=-S;i<=S;i+=S/2){ x.beginPath(); x.moveTo(i,S); x.lineTo(i+S,0); x.stroke(); }   // diagonales 45°, periodo S/2 → seamless
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; return crispen(t); }

function breakBrick(group, bar){ const ud=group.userData; if(ud.aliveCount<=0) return;
  let ballX=null, bd=1e9;
  for(const b of sim.balls){ if(b.rank===-1||b.safe) continue;
    if(Math.abs(b.y-bar.y)<1.5 && Math.abs(b.x-bar.xc)<12 && b.y<bar.y+0.6){ const d=Math.abs(b.y-bar.y); if(d<bd){bd=d;ballX=b.x;} } }
  let best=null,bs=1e9; for(const br of ud.bricks){ if(!br.alive) continue; const wx=bar.xc+br.x;
    const s=(ballX!=null?Math.abs(wx-ballX):Math.abs(wx-bar.xc))+br.row*0.4; if(s<bs){bs=s;best=br;} }

      P.burst(k.x,k.y,0.55,[1,0.5,0.1],FX_LOUD?36:24,9.0); P.burst(k.x,k.y,0.42,[1,1,0.6],13,5.2);   // metralla ardiente + chispas
      P.burst(k.x,k.y,0.4,c,10,4.5);                                             // + algo del color de la bola destruida
    } else {   // trampas/boulder/eliminated: estallido del color de la bola
      P.burst(k.x,k.y,0.45,c,18,6.0); P.burst(k.x,k.y,0.45,[1,1,1],9,4.0);
      P.ring(k.x,k.y,c,0.6); flashAt(k.x,k.y,new THREE.Color(c[0],c[1],c[2]),0.6,0.8);
    }
  }
  for(const s of ev.save){ if(s.id==null) continue;
    if(STAR_ON && s.star){   // RECHAZO de la PROTECCIÓN (spec 2026-07-18): la estrella APARTA el hazard con un destello
      // PEQUEÑO + fricción — se lee "una protección lo rechaza", NO una explosión blanca gigante. THROTTLE por bola:
      // el contacto continuo (bola sentada en mina, boulder pasándole por encima varios frames) genera un save POR
      // FRAME; sin throttle era un estroboscopio blanco (queja del dueño). Así sale UN rechazo por oleada de peligro.
      const o=ballObjs[s.id];
      if(!(o && sim.f-(o.lastStarHitF??-999) < 24)){   // 24f ≈ 0.8s entre rechazos de la misma bola
        if(o){ o.lastStarHitF=sim.f; o.squash=Math.max(o.squash||0,0.5); }   // squash genérico = fricción del rechazo
        const mag=(s.id%2===0);                                              // alterna la onda cian/magenta por bola
        flashAt(s.x,s.y,0xffffff,1.3,0.6);                                   // flash blanco LOCAL (~BALL_R*1.7), peak moderado (antes *5, 0.9)
        P.ring(s.x,s.y, mag?[1,0.35,1]:[0.35,1,1], 0.7);                     // UNA onda pequeña (cian o magenta)
        starsInv.burst(s.x,s.y,0.5,0.7);                                     // estrellas moderadas
        P.burst(s.x,s.y,0.5, mag?[1,0.6,1]:[0.6,1,1], 7, 3.6);              // pocas chispas del color de la protección
        emo.fire(s.id,'chuleria',PRIO.chuleria,12,f); shake=Math.max(shake,0.12);
      }
    } else emo.fire(s.id,'susto',PRIO.susto,10,f);   // near-miss normal (frenó a tiempo): susto sutil, NO estrella
  }
  // AVISO DE DETECCIÓN (telegrafía JUSTO antes de que baje la mirilla): al PRIMER frame moviéndose en rojo,
  // anillo rojo que se expande + destello → deja claro POR QUÉ la van a apuntar (se movió en rojo). Exagerado en v6.
  for(const sc of ev.scan){ P.ring(sc.x,sc.y,[1,0.15,0.15],FX_LOUD?1.9:1.3); P.ring(sc.x,sc.y,[1,0.3,0.3],FX_LOUD?1.25:0.9);
    flashAt(sc.x,sc.y,0xff3020,FX_LOUD?1.4:0.9,0.7);
    if(sc.id!=null) emo.fire(sc.id,'susto',PRIO.susto,10,f); }
  for(const c of ev.cross){ const col=sat(PAL[c.team].color); P.burst(c.x!=null?c.x:0,GATE_Y,0.3,col,14,3.5);
    emo.fire(c.id,'extasis',PRIO.extasis,16,f); }
  // BARRERA: chispas/escombros al golpear; estallido grande al reventarse. v7 = HIELO (astillas blanco/cian).
  const dR=ARTV?0.80:0.62, dG=ARTV?0.94:0.46, dB=ARTV?1.0:0.30;   // color de escombros (hielo vs ladrillo)
  for(const bz of ev.barrier){
    if(bz.broken){ shake=Math.max(shake,0.4);
      for(let k=0;k<4;k++) P.burst(bz.xc+(Math.random()-.5)*18, bz.y, 0.5, dR,dG,dB, 22, 7.0);
      P.ring(bz.xc,bz.y,ARTV?[0.7,0.9,1.0]:[0.7,0.5,0.3],1.4); flashAt(bz.xc,bz.y,ARTV?0xcdeeff:0xffe0a0,1.6,0.7); }
    else if(Math.random()<0.5){ const dx=(Math.random()-.5)*20; P.emit(bz.xc+dx, bz.y-0.6, 0.7, dR,dG,dB, (Math.random()-.5)*3, -1-Math.random()*2,0, 0.4); }   // escombros al embestir
  }
  // ENTRADA EN ROJO ("¡ALTO!"): destello rojo grande centrado en pantalla (WebGL → va en el vídeo) + tirón de
  // cámara. Junto al tinte rojo de la escena (sync) hace que "se ponga rojo" se note muchísimo (feedback del dueño).
  for(const ph of ev.phase){ if(ph.color==='red'){ shake=Math.max(shake,0.30); flashAt(camX,camY,0xff1810,54,0.52); } }   // centrado en la CÁMARA (en short también se mueve en X)
}

// === PASO DE SIM (30 Hz) con snapshot para INTERPOLAR el render a 60 fps ===
function stepOnce(){
  for(let i=0;i<sim.balls.length;i++){ const b=sim.balls[i]; px[i]=b.x; py[i]=b.y; }
  for(let i=0;i<sim.geo.boulders.length;i++) prevBoulderX[i]=sim.boulderX(i);
  sim.playerRun(runHeld);   //+AG vuelca CORRER (mantener pulsado) a la sim ANTES del paso: motor ON mientras esté pulsado
  const wasDecided = sim.decision_frame!==null;   //+AG detectar la resolución en ESTE paso (fanfarria + espectador en vivo)
  const ev=sim.step(); if(ev) react(ev);
  //+AG SFX EN VIVO + estado del jugador (espectador). Con un jugador el futuro no se puede precalcular.
  if(ev){ const p=sim.balls[0];
    //+AG carga del SÚPER NITRO (patrón superVal del Cazador, atada a INPUTS — se gana jugando bien):
    //   · PARÓN LIMPIO APURADO: te movías al llegar el rojo y frenaste dentro del margen → +0.08..0.22
    //     (cuanto más tarde paras dentro de la ventana de gracia+lock, más carga: apurar tiene premio)
    //   · ADELANTAR corriendo en verde: +0.05 por bola viva que estaba por delante y ya no (px/py = frame previo)
    //   · goteo por correr en verde: +0.0012/frame (~0.036/s) — llena solo, pero MUY despacio
    if(phase==='play' && sim.decision_frame===null && p.rank===null && !p.safe){
      const sp=Math.hypot(p.vx,p.vy);
      if(sim.color==='green' && runHeld && sp>0.8) superVal=Math.min(1,superVal+0.0012);
      if(sim.color==='green' && runHeld){ let ov=0;
        for(const b of sim.balls){ if(b.id===0||b.rank!==null||b.safe) continue;
          if(py[b.id]>py[0] && b.y<p.y) ov++; }
        if(ov) superVal=Math.min(1,superVal+0.05*ov); }
      for(const ph of ev.phase){ if(ph.color==='red'){ redEntryMoving = sp>sim.vThresh; redEntryF=sim.f; } }
      if(sim.color==='red' && redEntryMoving && sp<=sim.vThresh){
        const apuro=Math.min(1,(sim.f-redEntryF)/36);   // 36f ≈ gracia(18)+apuntado: parar en el último suspiro = máx
        superVal=Math.min(1,superVal+0.08+0.14*apuro); redEntryMoving=false; }
      if(sim.color==='green') redEntryMoving=false;
    }
    liveSfx(ev, !wasDecided && sim.decision_frame!==null);
    //+AG PUESTO INSTANTANEO EN META (feedback Jaime 2026-07-27, mismo arreglo que race): al cruzar a salvo tu
    //   puesto es DEFINITIVO (los safe ordenan por orden de cruce, placeOf), asi que se canta aqui y no al
    //   resolverse la ronda entera. Solo INDIVIDUAL (en equipos manda el puesto del EQUIPO, que se sabe al final)
    //   y solo cruce (la eliminacion ya tiene su cartel de espectador, y ese puesto aun puede moverse).
    if(!metaSung && EMBED && !TUTORIAL && sim.individual!==false && p.safe){
      metaSung=true; metaCartelVivo=true;
      cantarPuesto({ place:p.rank, total:sim.balls.length, lang:LANG }, ()=>{
        metaCartelVivo=false;
        if(metaFinPend){ const f=metaFinPend; metaFinPend=null; f(); }
      });
    }
    if(prevPlayerRank===null){
      const pwin = sim.winner_team!==null && p.team===sim.winner_team && (p.safe || sim.decision_frame!==null);
      if(p.rank===-1){ prevPlayerRank=p.rank; showSpectator(false); }        // te eliminaron (semáforo/mina/boulder)
      else if(pwin){ prevPlayerRank=1; showSpectator(true); }                // cruzaste primero (o sobreviviste la mejor): ¡ganaste!
    }
  }
}

function updateSemaforo(){
  // al decidirse el punto, el farol se APAGA (docs/44 §12: cierre "oddly satisfying", la maquinaria se detiene)
  if(sim.decision_frame!==null){ document.getElementById('ring').className='';
    document.getElementById('lampR').className='lamp'; document.getElementById('lampA').className='lamp'; document.getElementById('lampG').className='lamp';
    duckMusic('off'); return; }
  const f=sim.f, framesToEnd=sim.phaseEnd-f, WARN=18;
  const amber=sim.color==='green' && framesToEnd<=WARN;
  const state = amber?'amber':(sim.color==='red'?'red':'green');
  document.getElementById('ring').className = state;
  // SELLO DEL MODO: la música suena en VERDE (y ámbar) y se APAGA en ROJO (se avanza solo mientras suena, §3).
  duckMusic(sim.color==='red' ? 'red' : 'green');
  document.getElementById('lampR').className = 'lamp'+(state==='red'?' on-red':'');
  document.getElementById('lampA').className = 'lamp'+(state==='amber'?' on-amber':'');
  document.getElementById('lampG').className = 'lamp'+(state==='green'?' on-green':'');
}

function sync(dt, a=1){
  const celebrating = sim.winner_team!==null && sim.decision_frame!==null;
  const f=sim.f, G=sim.geo, fF=Math.max(0,sim.f-1+a), fr=dt*FPS;
  // CELEBRACIÓN: coloca a las campeonas (equipo ganador, cruzadas) en FILA centrada bajo el trofeo, para que se
  // lean como ganadoras y no como "puntos apilados" detrás de la copa (feedback del dueño 2026-07-18). Render-only.
  let winRow=null, winCX=0, winY=0, winSp=0;
  if(celebrating){ winRow=sim.byTeam[sim.winner_team].filter(x=>x.safe).sort((p,q)=>p.num-q.num);
    const cvw=cam.right-cam.left, cvh=cam.top-cam.bottom;
    winCX=cam.position.x; winY=cam.position.y - cvh*0.06; winSp=Math.min(2.8, cvw*0.11); }
  updateSemaforo();

  // MOOD v7.1: la escena se TIÑE DE ROJO en ROJO (peligro, se nota muchísimo), cálida en verde. Transición ~0.15s.
  if(ARTV && ambLight){ const red=sim.color==='red'&&sim.decision_frame===null, kk=Math.min(1,0.22*fr+0.06);
    ambLight.color.lerp(red?AMB_RED:AMB_WARM, kk); ambLight.intensity += ((red?AMB_I_RED:AMB_I_WARM)-ambLight.intensity)*kk;
    if(keyLight){ keyLight.color.lerp(red?KEY_RED:KEY_WARM, kk); keyLight.intensity += ((red?KEY_I_RED:KEY_I_WARM)-keyLight.intensity)*kk; } }

  // MINAS: al pararse una bola encima, la mina SE ARMA con un parpadeo ROJO que ACELERA (pi-pi-pi) hasta volverse
  // constante y DETONAR — la muerte 'losa' dispara la explosión (arriba en react). armF: 0→ARM_F. Render puro.
  const MINE_ARM_F=15;   // = ARM_F en redlight/sim.js (si cambia allí, cámbialo aquí)
  for(let i=0;i<mineM.length;i++){ const pad=sim.pads[i], ud=mineM[i].userData;
    let target=0;
    if(pad.armed){ const p=Math.min(1,pad.armF/MINE_ARM_F);
      const blink=0.5+0.5*Math.cos(Math.PI*pad.armF*pad.armF/9);   // fase ∝ armF² → el parpadeo se ACELERA (pi-pi-pi)
      const solid=p*p*p;                                           // hacia el final se satura: el parpadeo pasa a CONSTANTE
      target=(0.4+0.6*p)*((1-solid)*blink+solid);                  // intensidad sube y el rojo se vuelve fijo justo antes del boom
      ud.glow.scale.setScalar(1+0.6*p); }                          // + el halo CRECE al acercarse la detonación
    else ud.glow.scale.setScalar(1);
    ud.glow.material.opacity += (target-ud.glow.material.opacity)*Math.min(1,0.8*fr+0.2); }   // poco suavizado: que se LEA el parpadeo
  // BARRERA: v7.2 = rejilla de ladrillos de hielo que se rompen UNO A UNO por donde tocan; brillan más cuanto
  // menos vida ("brilla brilla brilla") y estallan al romperse. v5 = losa que se encoge y enrojece.
  for(let i=0;i<barrierM.length;i++){ const bar=sim.barriers[i], ud=barrierM[i].userData;
    if(ud.ice){
      if(bar.broken){ while(ud.aliveCount>0) breakBrick(barrierM[i], bar); continue; }   // reventar los que queden
      const frac=Math.max(0,bar.hp/bar.hp0), target=Math.ceil(frac*ud.total);
      while(ud.aliveCount>target) breakBrick(barrierM[i], bar);                            // rompe hasta dejar los que corresponden al HP
      ud.mat.emissiveIntensity = 0.3 + (1-frac)*(0.55+0.5*Math.abs(Math.sin(fF*0.5)));    // brilla más cuanto menos vida
      ud.mat.color.setRGB(0.78+0.16*(1-frac),0.93+0.05*(1-frac),1.0);                     // y se blanquea
    } else {
      if(bar.broken){ barrierM[i].visible=false; continue; }
      const frac=Math.max(0.12,bar.hp/bar.hp0); ud.slab.scale.z=frac; ud.slab.position.z=0.95*frac;
      ud.mat.emissive.setRGB(0.5*(1-frac),0.05,0);
    } }
  // BOULDERS: interpolar X (el grupo) + girar solo la ROCA (no la sombra) proporcional al avance = "rueda"
  for(let i=0;i<boulderM.length;i++){ const grp=boulderM[i], bx=prevBoulderX[i]+(sim.boulderX(i)-prevBoulderX[i])*a;
    const last=grp.userData.lastX==null?bx:grp.userData.lastX; grp.position.x=bx;
    if(grp.userData.rock) grp.userData.rock.rotation.y -= (bx-last)*0.9; grp.userData.lastX=bx; }

  // bolas
  for(let i=0;i<sim.balls.length;i++){ const b=sim.balls[i], o=ballObjs[i];
    if(b.rank===-1){ o.g.visible=false; continue; } o.g.visible=true;
    let bx=px[i]+(b.x-px[i])*a, by=py[i]+(b.y-py[i])*a;
    let jump=0;
    if(b.safe){ if(o.cf===undefined)o.cf=f; const amp=(celebrating && b.team===sim.winner_team)?1.0:0.5; jump=Math.abs(Math.sin((fF-o.cf)*0.22))*amp; }
    const champ = celebrating && b.safe && b.team===sim.winner_team;
    // Fila de campeonas bajo el trofeo: SOLO en torneo, donde son VARIAS y hay que ordenarlas. En el short hay UNA
    // y ya está en la meta: moverla al centro del encuadre se leía como un teletransporte al medio del mapa
    // (feedback del dueño 2026-07-20). Se queda donde llegó, saltando, y es la CÁMARA la que va a por ella.
    if(champ && !sim.individual){ const idx=winRow.indexOf(b); bx=winCX+(idx-(winRow.length-1)/2)*winSp; by=winY; }
    o.g.position.set(bx, by+jump, 0.5);
    const lose = celebrating && b.team!==sim.winner_team;
    o.g.scale.setScalar(b.scale*(lose?0.85:(champ?(sim.individual?1.30:1.15):1)));   // campeona: en short, plano de premio => algo mayor
    o.sqUpdate(bx, by+jump, dt);
    // CONTRASTE DE LA INFRACCIÓN (opción C, 2026-07-08): en ROJO, las cumplidoras (paradas) se ATENÚAN a
    // "estatua" fría y la que SIGUE deslizándose queda ENCENDIDA + deja ESTELA + anillo. Así se aprecia que esa
    // bola PARÓ TARDE (patinó de más) respecto a las demás, y por eso la marcan/ejecutan (la sim v6 alarga el
    // patinaje ~1.7→2.7 diámetros justo para que este deslizón se vea).
    if(o.mat && FX_LOUD){ const inRed = sim.color==='red' && !b.safe && sim.decision_frame===null;
      const sp=Math.hypot(b.vx,b.vy), moving = inRed && sp>sim.vThresh, statue = inRed && !moving, k=Math.min(1,0.35*fr+0.12);
      // culpable = ROJO PELIGRO encendido; estatua = apagada (sin tinte, para no enturbiar con la escena roja)
      const tEI = moving ? (1.10+0.40*Math.abs(Math.sin(fF*1.3))) : (statue ? 0.08 : 0.20);
      o.mat.emissiveIntensity += (tEI-o.mat.emissiveIntensity)*k;
      const [cr,cg,cb]=o.col, er=moving?1.0:cr, eg=moving?0.14:cg, eb=moving?0.10:cb;   // moviéndose en rojo → emisivo ROJO
      const E=o.mat.emissive; E.setRGB(E.r+(er-E.r)*k, E.g+(eg-E.g)*k, E.b+(eb-E.b)*k);
      if(moving){ const n=sp>1e-4?1/sp:0;                                               // ESTELA roja opuesta a la velocidad = "sigue deslizándose en rojo"
        if(Math.random()<Math.min(1,1.7*fr)){ P.emit(bx-b.vx*n*0.5, by-b.vy*n*0.5, 0.55, 1.0,0.14,0.10, -b.vx*0.6,-b.vy*0.6,0, 0.32);
          P.emit(bx+(Math.random()-.5)*0.5, by+(Math.random()-.5)*0.5, 0.5, 1.0,0.5,0.35, (Math.random()-.5)*1.5,(Math.random()-.5)*1.5,0, 0.24); }
        if(f%5===0) P.ring(bx,by,[1,0.16,0.12],0.9); }                                  // anillo de peligro ROJO bajo la culpable
    }
    // AURA de PROTECCIÓN (EVENTO breve — NO estado): solo durante la ventana de rechazo `b.starF` (~0.67s tras
    // salvarse de un golpe REAL). Antes lo pinté como estado constante (bola en el suelo del embudo) → activo el 66%
    // del clip y hasta 22 bolas a la vez con círculo = ruido ("se está yendo la olla", Jaime 2026-07-18). Ahora es un
    // destello de rim cian↔magenta SOLO en la bola recién rechazada, que se desvanece con la ventana → sincronizado
    // con el rechazo blanco (react, throttled). Standalone: b.starF nunca se pone (no hay embudo) → aura nunca sale.
    if(auraM[i]){ const au=auraM[i];
      const rem=(STAR_ON && b.starF) ? (b.starF - sim.f) : 0;      // frames que quedan de la ventana de protección
      if(rem>0 && !b.safe){ const w=Math.min(1,rem/20); au.visible=true; au.position.set(bx,by,0.52);
        const ph=fF*0.9+i*1.7;                                     // parpadeo rápido durante el flare
        au.material.opacity=w*(0.30+0.30*(0.5+0.5*Math.sin(ph)));  // se DESVANECE con la ventana (w→0)
        const tc=0.5+0.5*Math.sin(ph*0.5);
        au.material.color.setRGB(1-0.7*tc, 0.4+0.6*tc, 1.0);       // cian↔magenta (huecos sin equipo, aguanta el rojo)
        au.scale.setScalar(1.05+0.12*(1-w));                       // se expande un pelín al apagarse
      } else au.visible=false;
    }
    // ESCUDO (icono heraldo con check): FLOTA sobre el borde superior de la bola (no la tapa → no compite con el
    // flash/aura que ocurren ENCIMA de la bola a la vez, que era por lo que "no se veía"). Ligado a la ventana de
    // protección `b.starF`, pero con POP-IN, HOLD ~0.4s más allá de la ventana y FADE → tiempo de registrarlo. Arranca
    // ~3f tras el golpe (primero el golpe, luego ves el escudo que lo paró). ?shield=0 lo apaga. Standalone: nunca.
    if(SHIELD_ON && shieldM[i]){ const sh=shieldM[i], ud=sh.userData;
      const rem=(STAR_ON && b.starF) ? (b.starF - sim.f) : 0;
      if(rem>0 && rem<=17 && !b.safe){                              // rem 20→17 = ~3f tras el golpe
        if(ud.until==null || ud.until < sim.f) ud.born=sim.f;       // (re)nace con pop si estaba apagado
        ud.until = sim.f + 12;                                      // y AGUANTA 12f (~0.4s) tras el último golpe
      }
      if(ud.until!=null && sim.f<=ud.until && b.rank!==-1 && !b.safe){
        sh.visible=true;
        const pop=Math.min(1,(sim.f-(ud.born||sim.f))/5);          // pop-in de escala en ~5f
        const fade=Math.min(1,(ud.until-sim.f)/8);                 // fade-out en los últimos ~8f
        sh.scale.setScalar((0.6+0.4*pop)*(0.97+0.05*Math.sin(fF*0.35)));   // pop + respiración mínima
        sh.material.opacity=0.62*pop*fade;                         // semitransparente: se ve la bola por debajo
        sh.position.set(bx, by, 0.62);                             // CENTRADO sobre la bola (Jaime lo prefiere tapándola)
      } else sh.visible=false;
    }
    // emociones (despiertas): meta=extasis; perder=triste; en ROJO parado=concentrada/tensa (NUNCA dormida);
    // avanzando en verde=concentrada; detectada moviéndose=susto
    if(b.safe){ if(celebrating && b.team===sim.winner_team) emo.ambient(i,'extasis',PRIO.extasis);
      else if(celebrating) emo.ambient(i,'triste',4); else emo.ambient(i,'extasis',PRIO.extasis); }
    else if(b.detectF>0 || (sim.color==='red' && Math.hypot(b.vx,b.vy)>0.5)) emo.ambient(i,'susto',PRIO.susto);
    else if(sim.color==='red') emo.ambient(i,'concentrada',PRIO.concentrada);   // parada/vigilante en rojo (NUNCA dormida)
    else if((b.y-py[i])>0.02) emo.ambient(i,'concentrada',PRIO.concentrada);      // avanzando en verde
    else emo.ambient(i,'neutral',0);
    o.setExpr(archFace(i===0?ARCH_KEY_P:null, emo.resolve(i,f)));   //+AG en reposo, TU bola pone la cara de su ficha
  }
  // MIRILLAS (medidor de peligro ROJO): el disco interior CRECE hasta LLENAR el aro mientras la bola sigue en
  // rojo; al llenarse (charge→1) es cuando dispara. Palpita cada vez más rápido cerca del tope. Haz rojo la señala.
  let si=0;
  for(let i=0;i<sim.balls.length && si<scopePool.length;i++){ const b=sim.balls[i];
    if(b.rank===null && b.targeted){ const bx=px[i]+(b.x-px[i])*a, by=py[i]+(b.y-py[i])*a; const sc=scopePool[si], abm=aimBeams[si]; si++;
      sc.visible=true; sc.position.set(bx,by,0.92);
      const ch=1-Math.max(0,b.targetedF/18);                          // CARGA: 0 recién apuntada → 1 dispara
      const pulse=1+0.10*Math.sin(fF*(1.0+5*ch));                     // late más rápido cuanto más llena
      sc.scale.setScalar((FX_LOUD?2.15:1.9)*pulse); sc.rotation.z=fF*0.05;
      sc.userData.fill.scale.setScalar(0.06+0.98*ch);                // el disco CRECE hasta llenar el aro
      sc.userData.fill.material.opacity=0.32+0.55*ch;
      sc.userData.ring.material.opacity=0.55+0.45*ch;
      abm.visible=true; abm.position.set(bx,by,0.5); abm.material.color.set(0xff2020);
      abm.scale.set(0.4+0.6*ch,1,1); abm.material.opacity=0.18+0.5*ch; } }
  for(;si<scopePool.length;si++){ scopePool[si].visible=false; aimBeams[si].visible=false; }
  // FOGONAZOS (pool)
  for(const m of flashPool){ if(!m.userData.active) continue; m.userData.life+=dt; const t=m.userData.life/0.5;
    m.scale.setScalar(m.userData.r*(1+t*3.5)); m.material.opacity=m.userData.peak*Math.max(0,1-t);
    if(t>=1){ m.visible=false; m.userData.active=false; } }
  // HAZ DE DISPARO (fire-and-fade): se abre y se desvanece rápido
  for(const m of firePool){ if(m.userData.life<0) continue; m.userData.life+=dt; const t=m.userData.life/0.26;
    m.scale.set(3.2*(1+t*1.3),1,1); m.material.opacity=Math.max(0,1-t);
    if(t>=1){ m.visible=false; m.userData.life=-1; } }
  //+AG ANILLO TÚ sobre tu bola (interpolado). BLANCO normal, ROJO parpadeante si el francotirador te apunta
  //   (plb.targeted) = "van a por TI, ¡para!". Se oculta al morir/celebrar. La etiqueta TÚ es DOM proyectado.
  const plb=sim.balls[0];
  if(plb.rank!==-1 && !celebrating){
    const pbx=px[0]+(plb.x-px[0])*a, pby=py[0]+(plb.y-py[0])*a, aimed=plb.targeted;
    youRing.visible=true; youRing.position.set(pbx,pby,0.9);
    youRing.material.color.set(aimed?0xff2020:0xffffff);
    youRing.material.opacity = aimed?(0.72+0.28*Math.abs(Math.sin(fF*1.6))):(0.60+0.22*Math.abs(Math.sin(fF*0.4)));
    _v3.set(pbx, pby+BALL_R*2.2, 0.9).project(cam);
    youLbl.style.left=((_v3.x*0.5+0.5)*innerWidth).toFixed(0)+'px';
    youLbl.style.top=((-_v3.y*0.5+0.5)*innerHeight).toFixed(0)+'px';
    youLbl.style.opacity = plb.safe?'0':'1';
  } else { youRing.visible=false; youLbl.style.opacity='0'; }
  //+AG feedback de boosters sobre TU bola (lenguaje visual del motor, no inventar códigos nuevos):
  //   Nitro/Súper = la ESTELA CIAN compartida del chasis (= velocidad); Súper además la dobla (más gorda) y
  //   suelta chispas DORADAS (oro=acción); Fantasma = bola translúcida (swap de material) + jirones pálidos.
  { const pI=sim.pIn, alive=plb.rank===null && !plb.safe && sim.decision_frame===null;
    const nOn=alive && f<pI.nitroUntil, sOn=alive && f<pI.superUntil, gOn=alive && f<pI.ghostUntil;
    const pbx=px[0]+(plb.x-px[0])*a, pby=py[0]+(plb.y-py[0])*a;
    if((nOn||sOn) && Math.hypot(plb.vx,plb.vy)>1.2){
      P.trail(pbx,pby,plb.vx,plb.vy);
      if(sOn){ P.trail(pbx,pby,plb.vx,plb.vy);
        P.emit(pbx,pby,0.5, 1.0,0.83,0.25, -plb.vx*0.4,-plb.vy*0.4,0, 0.30); }
    }
    if(gOn && f%2===0) P.emit(pbx+(Math.random()-.5)*0.3, pby+(Math.random()-.5)*0.3, 0.45, 0.82,0.86,1.0, -plb.vx*0.3,-plb.vy*0.3,0, 0.38);
    setGhostLook(gOn);
  }
  updateHud();
}

function frameCamera(dt, a=1){ shake=Math.max(0,shake-dt*1.5);
  if(SHORT_ON && !SHORT_CAM_OLD){ frameCameraShort(dt); return; }
  // objetivo: la META en celebración; si no, el frente de las bolas vivas. Si el líder muere, el frente BAJA,
  // pero la cámara NO salta atrás (retrocede muy despacio) → sin "teletransporte".
  if(sim.decision_frame!==null){ camTargetY = GATE_Y-3; }
  //+AG POR EQUIPOS (Fase 3): en embed la camara sigue A TU BOLA (torneo enmarca todo el ancho → basta con la Y;
  //   tu bola nunca sale de plano en X). Sin jugador vivo cae al frente del grupo (broadcast). El eje X ya es el
  //   campo completo, asi que centrar en tu Y mantiene la "camara de jugador" sin tocar el look standalone.
  else if(EMBED && sim.balls[0].rank===null && !sim.balls[0].safe){ camTargetY = sim.balls[0].y - CAM_BACK + 5; }
  else { let frontY=null; for(const b of sim.balls){ if(b.rank===null && !b.safe){ if(frontY===null||b.y>frontY)frontY=b.y; } }
    if(frontY!==null) camTargetY = frontY - CAM_BACK + 5; }
  camTargetY = Math.max(SPAWN_Y+6, Math.min(GATE_Y-3, camTargetY));
  // suavizado INDEPENDIENTE del framerate (a 165fps se comportaba x5 más rápido) + límite de velocidad → nunca salta
  const k = camTargetY>camY ? 3.2 : 1.1;                 // avanza más rápido que retrocede (al morir el líder, no salta)
  let step = (camTargetY-camY)*(1-Math.exp(-k*dt));
  const maxStep = 16*dt;                                  // <=16 u/s → pan siempre suave
  camY += Math.max(-maxStep, Math.min(maxStep, step));
  frameOrtho(cam, FIELD_W*camMargin, 0, camY, shake, 'width'); }

// SHORT 9:16: cámara que ENCUADRA AL GRUPO (ver bloque CAM_FIT). Devuelve el frame más cerrado que contiene a
// todas las bolas en juego con margen, entre minW y maxW.
function frameCameraShort(dt){
  const CROWN = sim.decision_frame!==null && sim.winner_team!==null;
  //+AG PCAM: cámara de JUGADOR activa (embed, tu bola viva y aún sin cruzar). Se usa también abajo para
  //    SALTARSE el clamp vertical de pista: esa regla era del VIDEO (no enseñar delantal vacío) y aquí
  //    clavaba la cámara a media pista (y≈14.8) mientras tú salías en y≈2 — el plano se quedaba mirando
  //    los boulders en vez de a ti (feedback del dueño 2026-07-22).
  const PCAM = EMBED && !CROWN && sim.balls[0].rank===null && !sim.balls[0].safe;
  let wantW, cxT, cyT;
  if(CROWN){
    // CORONACIÓN: plano corto sobre la CAMPEONA, que está en la meta (medido: y≈44.2 = GATE_Y+0.2, no se mueve
    // de ahí). Antes se encuadraban también las perdedoras repartidas por la pista → la campeona salía pequeña y
    // descolgada, y parecía que "se teletransportaba al medio del mapa" (feedback del dueño 2026-07-20). Ahora la
    // cámara se va con ella y la línea de meta entra en cuadro: se entiende que ha LLEGADO.
    const w = sim.balls.find(b=>b.team===sim.winner_team) || sim.balls[0];
    wantW = CAM_FIT.crownW;
    cxT = w.x;
    cyT = w.y - 0.02*(wantW*16/9);        // casi centrada: la copa cabe encima sin pisarla y el damero entra justo debajo
  } else if(PCAM){
    //+AG cámara de JUGADOR: centrada en TU bola, ancho fijo PCAM_W. El sesgo hacia la meta te deja a ~40% de
    //    la parte BAJA del cuadro: ves lo que viene, y tú siempre en plano. Si mueres o cruzas la meta, cae al
    //    encuadre de grupo de abajo (modo espectador). La coronación manda igual.
    const p=sim.balls[0];
    wantW = PCAM_W;
    cxT = p.x;
    cyT = p.y + CAM_FIT.aheadFrac*(wantW*16/9);
  } else {
    // 1) caja de las que siguen en carrera
    let x0=Infinity, x1=-Infinity, y0=Infinity, y1=-Infinity, n=0;
    for(const b of sim.balls){ if(b.rank!==null || b.safe) continue; n++;
      if(b.x<x0)x0=b.x; if(b.x>x1)x1=b.x; if(b.y<y0)y0=b.y; if(b.y>y1)y1=b.y; }
    if(!n){ x0=x1=camX; y0=y1=camY; }                    // sin nadie en plano: mantener lo último (no dar bandazos)
    // 2) ancho pedido: el que hace caber la caja por ANCHO y por ALTO (el frame es 9:16 → el alto pesa 16/9)
    wantW = Math.min(CAM_FIT.maxW, Math.max(CAM_FIT.minW,
      (x1-x0) + 2*CAM_FIT.padX,
      ((y1-y0) + 2*CAM_FIT.padY) * 9/16));
    cxT = (x0+x1)/2;
    cyT = (y0+y1)/2 + CAM_FIT.aheadFrac*(wantW*16/9);     // sesgo hacia donde se corre
  }
  // 3) suavizado del zoom: ABRIR rápido (nadie se queda fuera), CERRAR lento (sin bombeo). En la coronación cierra
  //    rápido: es el plano de premio y solo dura 1.5 s.
  const kz = CROWN ? 4.5 : (wantW>camW ? 7.0 : 1.3);
  if(camWarm) camW += (wantW-camW)*(1-Math.exp(-kz*dt));
  else camW = wantW;                                     // 1er frame de la ronda: el encuadre ya sale hecho
  const visW = camW, visH = camW*16/9, halfW = visW/2;
  // 4) centro, clampado a los muros y al largo de la pista (sin franjas vacías). Si el frame es MÁS alto que la
  //    pista (zoom mínimo), los dos límites verticales se cruzan → centrar en la pista y ya.
  if(CROWN){
    // En la coronación manda la campeona: se la deja centrada aunque haya llegado pegada a un muro. Solo se
    // limita a que no entre más de ~1 u de delantal (si no, un tercio del plano se va en fondo violeta).
    const limC = Math.max(0, FIELD_W/2 + 1.0 - halfW);
    cxT = Math.max(-limC, Math.min(limC, cxT));
  } else if(PCAM){
    //+AG jugador: clamp SOLO en X (muros). En Y manda tu bola — sin el clamp de pista del vídeo, que en un
    //    plano de 27.6 u de alto te dejaba fuera de cuadro en la salida. Enseñar algo de delantal vacío
    //    por debajo del spawn es aceptable en el juego; perderte a TI, no.
    const lim = Math.max(0, FIELD_W/2 - halfW);
    cxT = Math.max(-lim, Math.min(lim, cxT));
  } else {
    const lim = Math.max(0, FIELD_W/2 - halfW);
    cxT = Math.max(-lim, Math.min(lim, cxT));
    const lo = SPAWN_Y-2.5+visH/2, hi = SAFE_Y+2.5-visH/2;
    cyT = lo>hi ? (lo+hi)/2 : Math.max(lo, Math.min(hi, cyT)); }
  if(!camWarm){ camX=cxT; camY=cyT; camWarm=true; }
  else { camX += Math.max(-14*dt, Math.min(14*dt, (cxT-camX)*(1-Math.exp(-3.0*dt))));
         camY += Math.max(-20*dt, Math.min(20*dt, (cyT-camY)*(1-Math.exp(-3.4*dt)))); }
  // 5) el frame 9:16 pedido SIEMPRE cabe: en 1080×1920 sale exacto; en preview apaisado se ve de más a los lados.
  const A = innerWidth/innerHeight, byH = A >= 9/16;
  frameOrtho(cam, byH?visH:visW, camX, camY, shake, byH?'height':'width'); }

// ---- HUD (DOM, solo preview): minimapa vertical de posiciones. El MARCADOR de supervivencia va en el CANVAS
//      (chassis/censusboard.mjs => sale en el video). Fuera los pips-a-3 de "puntos": aqui se SOBREVIVE, no se
//      puntua (feedback del dueno 2026-07-18). El #top DOM queda vacio a proposito. ----
let miniDots=[], pipEls=[];
function buildHud(){ const top=document.getElementById('top'); top.innerHTML='';
  const mini=document.getElementById('mini'); mini.innerHTML='<div class="fin"></div>'; miniDots=[];
  for(let i=0;i<sim.balls.length;i++){ const c=sat(PAL[sim.balls[i].team].color), hex=`rgb(${c.map(v=>Math.round(v*255)).join(',')})`;
    const d=document.createElement('div'); d.className='md'; d.style.background=hex; mini.appendChild(d); miniDots.push(d); }
  // La fila de pips DOM la SUSTITUYE la franja SURVIVORS del canvas (2026-07-19): dos HUD en la misma esquina
  // superior se pisaban. Se conserva el código tras ?pips=1 por si hace falta comparar.
  const pipsEl=document.getElementById('pips'); pipsEl.innerHTML=''; pipEls=[];
  if(sim.individual && PIPS_DOM){ pipsEl.style.display='flex';
    for(let i=0;i<sim.balls.length;i++){ const c=sat(PAL[sim.balls[i].team].color), hex=`rgb(${c.map(v=>Math.round(v*255)).join(',')})`;
      const p=document.createElement('div'); p.className='pip'; p.style.background=hex; pipsEl.appendChild(p); pipEls.push(p); }
  } else pipsEl.style.display='none';
}
function updateHud(){
  const span=GATE_Y-SPAWN_Y;
  for(let i=0;i<miniDots.length;i++){ const b=sim.balls[i], d=miniDots[i];
    d.classList.toggle('dead', b.rank===-1); d.classList.toggle('fin', b.safe);
    const y = b.safe?GATE_Y:b.y; d.style.bottom=(Math.max(0,Math.min(1,(y-SPAWN_Y)/span))*100)+'%'; }
  // pips: viva=encendida · cruzada=encendida+glow dorado · muerta=atenuada+gris
  for(let i=0;i<pipEls.length;i++){ const b=sim.balls[i], p=pipEls[i];
    if(b.rank===-1){ p.style.opacity='0.16'; p.style.filter='grayscale(1)'; }
    else { p.style.opacity='1'; p.style.filter = b.safe?'drop-shadow(0 0 6px #ffd34d)':'none'; } }
  // CTA like/suscríbete (👍🔔) solo al coronar al ganador (SHORT). Animado POR FRAME (determinista en captura, usa sim.f).
  const cta=document.getElementById('cta');
  if(cta){ if(sim.individual && sim.winner_team!==null && sim.decision_frame!==null){
      const k=Math.min((sim.f-sim.decision_frame)/15,1), t=sim.f*0.2;
      const appear=0.6+0.4*k, pulse=1+0.09*Math.sin(t), bob=Math.sin(t*0.8)*6;
      cta.style.opacity=k.toFixed(3); cta.style.transform=`translateX(-50%) translateY(${bob.toFixed(1)}px) scale(${(appear*pulse).toFixed(3)})`;
      const ic=cta.querySelector('.ic'); if(ic){ const g=(8+12*(0.5+0.5*Math.sin(t*1.3)))|0; ic.style.boxShadow=`0 0 ${g}px rgba(255,205,55,.9),0 4px 16px rgba(0,0,0,.5)`; }
      cta.querySelectorAll('.sp').forEach((s,i)=>{ const ph=t*1.7+i*2.3; s.style.opacity=(0.3+0.7*(0.5+0.5*Math.sin(ph))).toFixed(2); s.style.transform=`scale(${(0.65+0.6*(0.5+0.5*Math.sin(ph))).toFixed(2)})`; });
      const th=cta.querySelector('.thumb'); if(th){ const tp=Math.max(0,Math.sin(t*1.7)); th.style.transform=`scale(${(1+0.17*tp).toFixed(3)}) rotate(${(-8*tp).toFixed(1)}deg)`; }
      const be=cta.querySelector('.bell'); if(be) be.style.transform=`rotate(${(17*Math.sin(t*2.7)).toFixed(1)}deg)`;
    } else cta.style.opacity='0'; }
}

//+AG INTRO: cuenta atrás 3-2-1-¡YA! con la SIM EN PAUSA (antes arrancaba de golpe). La cámara va de un plano
//   cerrado sobre TU bola a la vista del grupo, con onda/anillo sobre ti = "este eres tú". El motor del jugador y
//   la música se sueltan en el "¡YA!". Copia el patrón del Cazador, adaptado a la cámara 9:16 de este modo.
function introCamera(t){
  const p=sim.balls[0];
  const k=Math.min(1, t/(INTRO_DUR*0.72)), e=1-Math.pow(1-k,3);   // easeOutCubic hasta el encuadre del grupo
  const A=innerWidth/innerHeight, byH=A>=9/16;
  const w=6.0+(CAM_FIT.maxW-6.0)*e, visH=w*16/9;                  // de cerca de tu bola → grupo
  const cx=p.x*(1-e), cy=p.y+((SPAWN_Y+4)-p.y)*e;                 // recentra hacia la parrilla
  const halfW=w/2, lim=Math.max(0,FIELD_W/2-halfW); const ccx=Math.max(-lim,Math.min(lim,cx));
  const lo=SPAWN_Y-2.5+visH/2, hi=SAFE_Y+2.5-visH/2; const ccy=lo>hi?(lo+hi)/2:Math.max(lo,Math.min(hi,cy));
  camX=ccx; camY=ccy; camW=w; camWarm=true;                       // deja el encuadre "caliente" para que play no dé un salto
  frameOrtho(cam, byH?visH:w, ccx, ccy, 0, byH?'height':'width');
}
function introUI(t){
  const c=document.getElementById('count'), n=document.getElementById('countN'), p=sim.balls[0];
  c.classList.add('show');
  if(t-introRingT>0.42){ introRingT=t; P.ring(p.x,p.y,[1,1,1],1.3); P.ring(p.x,p.y,[0.33,0.9,0.5],0.95); }   // onda "este eres tú" (verde = correr)
  if(t<DIGITS*DIGIT){ const cur=DIGITS-Math.floor(t/DIGIT), frac=(t%DIGIT)/DIGIT;
    n.textContent=String(cur); n.style.color='#fff';
    n.style.transform=`scale(${(1+0.45*(1-frac)).toFixed(2)})`; n.style.opacity=(0.5+0.5*(1-frac)).toFixed(2); }
  else goFlash();
}
//+AG el "¡YA!" se pinta y la ronda arranca EN EL MISMO FRAME: el cartel se queda GO_HOLD ms encima del juego ya
//   en marcha, en vez de robarle ese tiempo a la partida con la sim congelada.
let goT=0;
function goFlash(){ const n=document.getElementById('countN');
  n.textContent=T().go; n.style.color='#7cff9a'; n.style.transform='scale(1)'; n.style.opacity='1';
  clearTimeout(goT); goT=setTimeout(()=>document.getElementById('count').classList.remove('show'), GO_HOLD); }

// PREVIEW loop: sim 30 Hz con acumulador; render interpola a la tasa del monitor
const clock=new THREE.Clock(); let acc=0;
let fpsT=0, fpsN=0, fpsSteps=0, fpsMax=0; const fpsEl=document.getElementById('fps');
function loop(){ const dt=Math.min(clock.getDelta(),0.05);
  //+AG fases previas a jugar, las dos con la sim EN PAUSA:
  //   'ready' = el cartel del modo está delante; el mundo se ve vivo detrás, en el encuadre cerrado de tu bola.
  //   'intro' = cuenta atrás: la cámara revela quién eres y corren los números.
  if(phase==='ready' || phase==='intro'){
    if(phase==='intro') introT+=dt;
    sync(dt,1); P.update(dt); stars.update(dt); starsInv.update(dt); wind.update(dt); updateControls();
    introCamera(introT); if(phase==='intro') introUI(introT);
    celeb.update(false, cam, dt, null); census.update(dt, cam, sim.balls, rlCensus); ktags.update(dt); renderFrame();
    if(phase==='intro' && introT>=INTRO_DUR){ phase='play'; acc=0; clock.getDelta(); goFlash();
      if(sim) sim.playerEngage();   //+AG desde el "¡YA!" manda el input: no pulsar CORRER = frenar
      startAudio(); }               //+AG suelta la música (loop) sincronizada con f=0
    requestAnimationFrame(loop); return;
  }
  acc+=dt; const STEP=1/FPS; let steps=0;
  if(coachPaused) acc=0;   //+AG tutorial v2: el COACH congela el mundo mientras pide una acción (misma familia que el hitstop)
  else if(hitstop>0){ hitstop--; acc=0; } // micro-freeze tras una ejecución: NO avanza la sim (determinista: mismos pasos, solo retrasados) pero SÍ sigue renderizando shake/partículas
  else while(acc>=STEP && !sim.done && steps<3){ stepOnce(); acc-=STEP; steps++; }   // cap 3: si va MUY lento, no teletransporta más de eso
  if(steps>=3) acc=0;   // se satura → suelta el atraso (evita bola de nieve de teletransportes)
  if(sim.done) acc=0;
  //+AG ronda resuelta: en EMBED emite el resultado al shell tras dejar ver la celebración (~900ms), patrón Cazador.
  if(sim.done && !ended){ ended=true;
    if(EMBED) setTimeout(emitEnd, 900); }
  const a=(sim.done||NO_INTERP)?1:Math.min(1,acc/STEP);
  sync(dt,a); P.update(dt); stars.update(dt); starsInv.update(dt); wind.update(dt); frameCamera(dt,a); updateControls();
  celeb.update(sim.winner_team!==null && sim.decision_frame!==null, cam, dt, sim.winner_team!==null?PAL[sim.winner_team].color:null);
  census.update(dt, cam, sim.balls, rlCensus); if(CUPO_ON) cupo.update(dt, cam, sim.placed, sim.survTarget); if(sim.decision_frame!==null) killfeed.dismiss(); killfeed.update(dt, cam); ktags.update(dt); renderFrame();
  // contador de FPS + pasos de sim por frame (si "sim/f" sube de 1 = va lento y teletransporta)
  fpsT+=dt; fpsN++; fpsSteps+=steps; if(steps>fpsMax)fpsMax=steps;
  if(fpsT>=0.5){ const fps=Math.round(fpsN/fpsT); if(fpsEl) fpsEl.textContent='fps '+fps+'  ·  sim/f '+(fpsSteps/fpsN).toFixed(1)+(fpsMax>1?' ⚠'+fpsMax:''); fpsT=0;fpsN=0;fpsSteps=0;fpsMax=0; }
  requestAnimationFrame(loop);
}
// CAPTURA 60 fps (2 subframes interpolados por paso de sim)
const CAP_FPS=60, CAP_SUB=CAP_FPS/FPS; let capK=0;
window.__cap = {
  step(){ if(!sim.done && capK%CAP_SUB===0) stepOnce(); capK++;
    const a=(sim.done||NO_INTERP)?1:(capK%CAP_SUB===0?1:(capK%CAP_SUB)/CAP_SUB); const dt=1/CAP_FPS;
    sync(dt,a); P.update(dt); stars.update(dt); starsInv.update(dt); wind.update(dt); frameCamera(dt,a);
    celeb.update(sim.winner_team!==null && sim.decision_frame!==null, cam, dt, sim.winner_team!==null?PAL[sim.winner_team].color:null);
  census.update(dt, cam, sim.balls, rlCensus); if(CUPO_ON) cupo.update(dt, cam, sim.placed, sim.survTarget); if(sim.decision_frame!==null) killfeed.dismiss(); killfeed.update(dt, cam); ktags.update(dt); renderFrame();
    return sim.done && capK%CAP_SUB===0; },
  done(){ return sim.done; }, info(){ return { fps:CAP_FPS, frame:sim.f, cap:capK, done:sim.done, seed:sim.seed, winner:sim.winner_team }; },
};

//+AG PUESTO del jugador al resolverse — UN SOLO criterio, el MISMO con que la sim corona (_finishByProgress): PROGRESO
//   hacia la meta. Cruzadas primero por orden de cruce; las demas (vivas o muertas) por Y de PROGRESO desc — una
//   muerta cuenta la Y DONDE MURIO (killed_y), como hace la sim en su sumY. Antes las muertas iban por CUANDO cayeron
//   (killed_f, tiempo) → la sim podia coronar por sumY a una que murio mas ADELANTE y no salia 1ª (medido 8/200 en
//   individual). Con Y-de-progreso el coronado (winner_team) es SIEMPRE el 1º. Empate → menor dorsal. Devuelve 1..N.
function placeOf(id){
  const score=b=> b.safe ? GATE_Y : (b.rank===-1 ? (b.killed_y ?? b.y) : b.y);
  const key=b=> b.safe ? [0, b.rank, 0] : [1, -score(b), b.num];
  const ord=[...sim.balls].sort((a,b)=>{ const A=key(a),B=key(b); return A[0]-B[0]||A[1]-B[1]||A[2]-B[2]; });
  return ord.findIndex(b=>b.id===id)+1;
}
//+AG CLASIFICACION DE EQUIPOS por PROGRESO — replica EXACTA del comparador con que la sim decide winner_team
//   (_checkDecided/_finishByProgress): 1) mas bolas en meta · 2) empate con cruces → el que cruzo ANTES (menor
//   lastCrossPlaced) · 3) mayor suma de Y (a salvo=GATE_Y, muerta=Y de muerte, viva=Y) · 4) bola mas adelantada ·
//   5) menor dorsal. Antes se ordenaba por la MEJOR bola suelta (min placeOf) → un equipo con 1 bola rapida adelantaba
//   al de mas cruces y NO era el coronado (medido 64/200). Ahora el coronado es SIEMPRE el 1º.
function teamOrderByProgress(){
  const cr=t=>sim.crossed[t], lcp=t=>sim.lastCrossPlaced[t];
  const scy=b=> b.safe ? GATE_Y : (b.rank===-1 ? (b.killed_y ?? b.y) : b.y);
  const sumY=t=>sim.byTeam[t].reduce((a,b)=>a+scy(b),0);
  const bestY=t=>Math.max(...sim.byTeam[t].map(b=>b.safe?GATE_Y:b.y));
  const bestNum=t=>{ let by=-1,num=99; for(const b of sim.byTeam[t]){ const y=b.safe?GATE_Y:b.y; if(y>by||(y===by&&b.num<num)){by=y;num=b.num;} } return num; };
  return sim.teams.map((_,t)=>t).sort((a,b)=>{
    if(cr(a)!==cr(b)) return cr(b)-cr(a);
    if(cr(a)>0 && lcp(a)!==lcp(b)) return lcp(a)-lcp(b);
    if(sumY(a)!==sumY(b)) return sumY(b)-sumY(a);
    if(bestY(a)!==bestY(b)) return bestY(b)-bestY(a);
    return bestNum(a)-bestNum(b);
  });
}
//+AG cartel de ESPECTADOR: al ganar/morir se ocultan los controles y se explica el estado. Reset en buildSim.
//+AG EMITIR RESULTADO (embed): lo llaman el final natural de la ronda Y el boton SALIR del cartel de espectador
//   (feedback Jaime 2026-07-23: al eliminarte no habia salida). Mismo calculo -> mismo puesto y mismas copas.
let emitted=false;
//+AG estado del cartel de meta instantaneo (ver el bloque de p.safe arriba): sung=ya se canto en el cruce ·
//   vivo=sigue en pantalla · finPend=matchEnd aplazado a su cierre (la regla cartel→resultado no se invierte).
let metaSung=false, metaCartelVivo=false, metaFinPend=null;
//+AG CLASIFICACION REAL para el shell (bug: la tabla de Resultados se inventaba los puestos). Reusa placeOf, el
//   MISMO criterio con el que ya se emitia playerPlace. Solo lee la sim.
function standingsPayload(){
  return sim.balls.map(b=>({ b, p:placeOf(b.id) })).sort((x,y)=>x.p-y.p)
    .map(x=>({ place:x.p, ballId:x.b.id, teamIdx:x.b.team, isPlayer:x.b===sim.balls[0],
      color:[x.b.color[0],x.b.color[1],x.b.color[2]] }));
}
function emitEnd(){
  if(TUTORIAL) return;   //+AG tutorial: sin matchEnd ni economía; el COACH cierra con bt:tutorialEnd
  if(emitted || !EMBED) return; emitted=true;
  const pp=placeOf(0);
  //+AG POR EQUIPOS (Fase 3): puesto del EQUIPO por PROGRESO (teamOrderByProgress = el criterio con que la sim corona);
  //   en INDIVIDUAL, win->1/else 0. Antes era la MEJOR bola suelta y no coincidia con el coronado (medido 64/200).
  let teamPlace, tst=null;
  if(sim.individual===false){ const order=teamOrderByProgress();
    teamPlace=order.indexOf(sim.balls[0].team)+1;
    tst=order.map((t,i)=>({ place:i+1, teamIdx:t, isPlayerTeam:t===sim.balls[0].team, color:[...sim.teams[t].color] })); }
  else teamPlace=(sim.winner_team!==null && sim.balls[0].team===sim.winner_team)?1:0;
  //+AG standings + color REAL del ganador para el disco de campeon del shell (antes el disco salia siempre rojo).
  //+AG winnerColor = color de lo que el MOTOR ha coronado (sim.winner_team) = lo que el jugador vio celebrar. La
  //   tabla puede ordenar por otro criterio (el que paga copas); el shell corona la fila del coronado, no la 1a.
  const st=standingsPayload(), wt=sim.winner_team;
  const winnerColor = (wt!=null && sim.teams[wt]) ? [...sim.teams[wt].color] : (st[0] ? st[0].color : null);
  //+AG el puesto se canta AQUÍ (cartel de fin compartido, veredicto.mjs) y el resultado se suelta DESPUÉS:
  //   mientras el cartel está en pantalla el shell no puede cerrar el iframe. En equipos manda el del EQUIPO.
  const _fin=()=>{ try{ parent.postMessage({type:'bt:matchEnd', mode:'redlight', seed, playerPlace:pp, teamPlace, winnerTeam:sim.winner_team, winnerColor, standings:st, teamStandings:tst, durationF:sim.f}, '*'); }catch(e){} };
  //+AG si ya se canto EN EL CRUCE no se repite: resultado ya, o aplazado a que ese cartel cierre.
  if(metaSung){ if(metaCartelVivo) metaFinPend=_fin; else _fin(); }
  else cantarPuesto({ place: (sim.individual===false)?teamPlace:pp, total: st.length, lang:LANG }, _fin);
}
function showSpectator(win){
  const sp=document.getElementById('spectator'), ti=document.getElementById('specTitle'), su=document.getElementById('specSub');
  const place=placeOf(0);
  const t=T();
  ti.textContent = win ? t.specWin : t.specLose;
  ti.style.color = win ? '#ffd23f' : '#ff6a5a';

//+AG CONTROLES: CORRER (mantener) domina; FRENAZO (recarga ~3s, tecla F); carriles ←/→ o 1/2/3; boosters
//   A/S/D = Nitro/Fantasma/Súper (mismo trío de teclas que el Cazador; el frenazo cede la S al Fantasma).
//   Touch-first (pointer) + teclado (espacio/↑ = correr).
const bRun=document.getElementById('bRun'), bBrake=document.getElementById('bBrake'), cdBrake=document.getElementById('cdBrake');
const bLaneL=document.getElementById('bLaneL'), bLaneC=document.getElementById('bLaneC'), bLaneR=document.getElementById('bLaneR');
const bNitro=document.getElementById('bNitro'), bGhost=document.getElementById('bGhost'), bSup=document.getElementById('bSup');
const cdNitro=document.getElementById('cdNitro'), cdGhost=document.getElementById('cdGhost'), cdSup=document.getElementById('cdSup');
const LANES=['left','center','right'];
function setRun(on){ runHeld=on && phase==='play'; bRun.classList.toggle('hold', runHeld); }
function doBrake(){ if(sim && phase==='play' && sim.playerBrake()) bBrake.classList.remove('ready'); }
//+AG carril: la INTENCIÓN cambia al instante (vale hasta en la intro); la bola tarda lo que tarde la física
function setLane(k){ if(!sim || !sim.playerLane(k)) return;
  bLaneL.classList.toggle('on', k==='left'); bLaneC.classList.toggle('on', k==='center'); bLaneR.classList.toggle('on', k==='right'); }
function shiftLane(d){ if(!sim) return; const i=LANES.indexOf(sim.pIn.lane); setLane(LANES[Math.max(0,Math.min(2,i+d))]); }
function doNitro(){ if(sim && phase==='play') sim.playerNitro(); }
function doGhost(){ if(sim && phase==='play') sim.playerGhost(); }
function doSuper(){ if(sim && phase==='play' && superVal>=1 && sim.playerSuper()){ superVal=0;
  const p=sim.balls[0]; flashAt(p.x,p.y,0xffd34d,1.5,0.85); P.ring(p.x,p.y,[1,0.83,0.3],0.8); } }   // flash DORADO al soltarlo (oro=acción)
// CORRER: pointer (mantener). pointerdown captura para recibir el up aunque salga del botón.
bRun.addEventListener('pointerdown',e=>{ e.preventDefault(); bRun.setPointerCapture?.(e.pointerId); setRun(true); });
bRun.addEventListener('pointerup',  e=>{ e.preventDefault(); setRun(false); });
bRun.addEventListener('pointercancel',()=>setRun(false));
bRun.addEventListener('pointerleave',()=>{ if(!bRun.hasPointerCapture) setRun(false); });
bRun.addEventListener('contextmenu',e=>e.preventDefault());
bBrake.addEventListener('pointerdown',e=>{ e.preventDefault(); doBrake(); });
bLaneL.addEventListener('pointerdown',e=>{ e.preventDefault(); setLane('left'); });
bLaneC.addEventListener('pointerdown',e=>{ e.preventDefault(); setLane('center'); });
bLaneR.addEventListener('pointerdown',e=>{ e.preventDefault(); setLane('right'); });
bNitro.addEventListener('pointerdown',e=>{ e.preventDefault(); doNitro(); });
bGhost.addEventListener('pointerdown',e=>{ e.preventDefault(); doGhost(); });
bSup.addEventListener('pointerdown',e=>{ e.preventDefault(); doSuper(); });
function updateControls(){
  if(!sim){ return; } const p=sim.balls[0], f=sim.f, dead=p.rank!==null||sim.decision_frame!==null||phase!=='play';
  // CORRER se pinta ROJO en fase roja del semáforo (aviso de "si corres ahora, te delatas")
  bRun.classList.toggle('red', sim.color==='red' && sim.decision_frame===null && phase==='play');
  bRun.disabled=dead; if(dead){ runHeld=false; bRun.classList.remove('hold'); }
  const bd=Math.max(0, sim.pIn.brakeCd - f), ready=!dead && bd<=0;
  bBrake.disabled=dead; bBrake.classList.toggle('ready', ready);
  cdBrake.textContent = dead ? '' : (bd>0 ? Math.ceil(bd/30)+'s' : 'F');
  //+AG boosters (patrón Cazador): recarga en segundos en .cd; activo = .act; cargado = .ready
  const nd=Math.max(0,sim.pIn.nitroCd-f), gd=Math.max(0,sim.pIn.ghostCd-f);
  const nAct=f<sim.pIn.nitroUntil, gAct=f<sim.pIn.ghostUntil, sAct=f<sim.pIn.superUntil;
  bNitro.disabled=dead||(!nAct&&nd>0); bNitro.classList.toggle('act',nAct&&!dead); bNitro.classList.toggle('ready',!dead&&!nAct&&nd<=0);
  cdNitro.textContent = dead?'':(nAct?T().on:(nd>0?Math.ceil(nd/30)+'s':'A'));
  bGhost.disabled=dead||(!gAct&&gd>0); bGhost.classList.toggle('act',gAct&&!dead); bGhost.classList.toggle('ready',!dead&&!gAct&&gd<=0);
  cdGhost.textContent = dead?'':(gAct?T().on:(gd>0?Math.ceil(gd/30)+'s':'S'));
  const sReady=superVal>=1&&!dead&&!sAct;
  bSup.disabled=dead||(!sReady&&!sAct); bSup.classList.toggle('ready',sReady); bSup.classList.toggle('act',sAct&&!dead);
  cdSup.textContent = dead?'':(sAct?T().on:(sReady?T().ready:Math.round(superVal*100)+'%'));
  for(const b of [bLaneL,bLaneC,bLaneR]) b.disabled=dead;
}
addEventListener('keydown',e=>{
  if(e.repeat){ return; }
  if(e.key===' '||e.key==='ArrowUp'){ e.preventDefault(); setRun(true); return; }
  if(e.key==='f'||e.key==='F'){ doBrake(); return; }
  if(e.key==='a'||e.key==='A'){ doNitro(); return; }
  if(e.key==='s'||e.key==='S'){ doGhost(); return; }
  if(e.key==='d'||e.key==='D'){ doSuper(); return; }
  if(e.key==='1'){ setLane('left'); return; }
  if(e.key==='2'){ setLane('center'); return; }
  if(e.key==='3'){ setLane('right'); return; }
  //+AG ←/→ mueven la intención de carril mientras JUEGAS; de espectador/intro conservan el cambio de semilla (debug)
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    const playing = phase==='play' && sim && sim.balls[0].rank===null && sim.decision_frame===null;
    if(playing){ e.preventDefault(); shiftLane(e.key==='ArrowLeft'?-1:1); return; }
    if(e.key==='ArrowRight'){ seed++; buildSim(seed); } else { seed=Math.max(1,seed-1); buildSim(seed); } return; }
  if(e.key==='r'||e.key==='R')buildSim(seed); });
addEventListener('keyup',e=>{ if(e.key===' '||e.key==='ArrowUp'){ setRun(false); } });

// ---- AUDIO (preview): música del modo por Web Audio. 4 variantes que el dueño generó (Suno) rotadas por
// semilla. SIN SFX todavía (sfxmap.mjs es el siguiente bloque); solo la música + el sello rojo/verde (§3). ----
const AUDIO_SR=44100;
//+AG música del modo VENDORIZADA a mp3 (fuera la rotación RL_TRACKS que dependía del Drive). musicGain 0.42 =
//   base del ducking (duckMusic baja a 0.10 en rojo → el "sello" Luz Roja/Verde: se avanza solo mientras suena).
//+AG PLAYLIST (doc 14 §1): vuelve la rotación, ahora con pistas VENDORIZADAS (nada del Drive) y al azar por
//   partida en vez de por semilla. Entran las dos "Slow - Tension" del canal, que estaban sin usar y son las que
//   mejor le pegan al modo. Además arreglan un problema real: redlight.mp3 dura 29 s y daba varias vueltas por
//   ronda (se notaba el bucle); tension1/tension2 duran 104 y 117 s. Medido con ebur128: las tres están entre
//   -14,8 y -15,0 LUFS, o sea que el 0.42 y su ducking valen igual para las tres sin retocar nada.
//+AG VB Jaime 2026-07-27: VOLUMEN DE MUSICA del jugador. El shell manda &mvol=0..1 (Ajustes; defecto 0.20 = muy
//   baja, para que no moleste) y multiplica el nivel calibrado del modo. FUERA del shell (standalone/captura de
//   video) no hay parametro y se queda en 1: el material del canal sigue sonando exactamente igual que siempre.
//   El ducking de rojo/verde tambien va escalado (MUSIC_BASE / MUSIC_RED), o el rojo sonaria MAS que el verde.
const MVOL=(()=>{ const v=parseFloat(_q0.get('mvol')); return (isFinite(v)&&v>=0&&v<=1)?v:(EMBED?0.65:1); })();   //+AG el 0.65 es el respaldo si el shell no manda &mvol; el defecto de verdad vive en MUSIC_VOL_DEF de juego.html
const MUSIC_BASE=0.42*MVOL, MUSIC_RED=0.10*MVOL;
const audio=createWebAudio({ musicUrl:pickTrack(['../_music/redlight.mp3','../_music/tension1.mp3','../_music/tension2.mp3']),
                             musicGain:MUSIC_BASE, musicLoopTrim:0.12 });
//+AG doc 38 Fase 1: DOS flags de audio (musica / efectos por separado). En EMBED los manda el shell via
//   &music=/&sfx= (defecto ON). En standalone arrancan mudos y el boton #snd los enciende (solo fuera del shell).
let musicOn=false, sfxOn=false, lastMusicColor=null;
if(EMBED){ musicOn = _q0.get('music')!=='0'; sfxOn = _q0.get('sfx')!=='0'; }
function startAudio(){
  if(!musicOn || !audio.unlocked) return;
  //+AG LA MÚSICA ENTRA CON LA CUENTA ATRÁS (VB Jaime 2026-07-27), no en el "¡YA!" como pedía doc 38/44: la entrada
  //   a partida se jugaba en silencio hasta 8,5 s (cartel de "¡LISTO!" + 3-2-1) con la del shell ya apagada, y eso
  //   se lee como "este juego no tiene música". Los beeps van a pico 0.9 y la música a ~0.27: no la pisa.
  if(phase!=='play' && phase!=='intro') return;
  if(audio.musicPlaying) return; //+AG y el "¡YA!" NO la reinicia: si ya entró con el 3-2-1, sigue donde va
  audio.start(null, AUDIO_SR);   //+AG solo la música en loop; los SFX se disparan EN VIVO (liveSfx): con un jugador el futuro no se precalcula
  lastMusicColor=null;           // el ducking se re-aplica en el 1er updateSemaforo
}
//+AG SFX EN VIVO: MISMA síntesis del vídeo (buildSfxBuffer de sfxmap) pero disparada evento a evento al ocurrir,
//   como en el port del Cazador (el accumulateEvents del vídeo solo valdría sin jugador).
let liveGain=null;
function liveSfx(ev, won){
  if(!sfxOn || !audio.unlocked || !audio.ctx) return;
  const reb={}; let any=false;
  for(const k in ev){ if(ev[k] && ev[k].length){ reb[k]=ev[k].map(e=>({...e, f:0})); any=true; } }
  if(!any && !won) return;
  const buf=buildSfxBuffer({ events:reb, decision_frame: won?0:null, f:FPS*4, seed:(seed*7919+sim.f)>>>0, SR:AUDIO_SR });
  if(!liveGain){ liveGain=audio.ctx.createGain(); liveGain.gain.value=0.92; liveGain.connect(audio.ctx.destination); }
  const ab=audio.ctx.createBuffer(1, buf.length, AUDIO_SR); ab.getChannelData(0).set(buf);
  const src=audio.ctx.createBufferSource(); src.buffer=ab; src.connect(liveGain); src.start();
}
// baja la música en ROJO, la devuelve en VERDE/ÁMBAR, la apaga al decidirse. Solo actúa en transiciones.
// MUSIC_MODE: 'low' (por defecto: baja MUCHO en rojo pero sigue de fondo bajo la alarma) | 'cont' (no baja) | 'duck' (silencio).
function duckMusic(mode){
  if(!musicOn || !audio.hasMusic) return;
  if(mode===lastMusicColor) return; lastMusicColor=mode;
  const base=MUSIC_BASE, RED_LOW=MUSIC_RED;
  if(mode==='off') audio.setMusicGain(0.0, 0.4);          // fin: se apaga suave
  else if(mode==='red') audio.setMusicGain(MUSIC_MODE==='duck'?0.0 : MUSIC_MODE==='cont'?base : RED_LOW, 0.16);   // rojo: baja mucho (o silencio/igual según flag)
  else audio.setMusicGain(base, 0.16);                    // verde/ámbar: vuelve a pleno
}

};
let LANG='en';
//+AG se declaran AQUÍ (y se construyen en el arranque, más abajo) porque applyLang los repinta y applyLang se
//   llama durante la carga del módulo: con const/let declarado después daría ReferenceError.
let arranque=null, banner=null;
const T=()=>I18N[LANG]||I18N.en;
//+AG ordinal de puesto: igual que el del shell (1st/2nd/3rd · 1º) para no dar dos vocabularios del mismo dato.
//   Desde el doc 49 lo dice el catalogo, que es donde estan los 20 idiomas.
function ord(n){ return BTI18N.ord(n,LANG); }
//+AG doc 49: los idiomas que no son en/es llegan en un fichero aparte. Quien quiera enterarse de que ya
//   esta (el tutorial, 70 lineas mas abajo) se apunta con alLlegarPack; si el paquete ya habia llegado
//   se le llama en el acto, que si no el que se apunta tarde se queda en ingles para siempre.
let PACK=null;
const TRAS_PACK=[];
function alLlegarPack(f){ TRAS_PACK.push(f); if(PACK){ try{ f(PACK,LANG); }catch(e){} } }
function applyLang(l){
  LANG=BTI18N.LANGS[l]?l:'en'; PACK=null;
  //   la PISTA no se espeja aunque el idioma sea arabe (noRtl): los carriles ◀/▶ apuntan a lo que pasa
  //   en pantalla y darles la vuelta mentiria sobre el juego. Sí se le pone su fuente y su <html lang>.
  BTI18N.applyDoc(LANG,{noRtl:true});
  pintaLang();
  BTI18N.load(LANG).then(p=>{ if(!p || LANG!==l) return;
    PACK=p;
    if(p.redlight) I18N[LANG]=Object.assign({},I18N.en,p.redlight);
    TRAS_PACK.forEach(f=>{ try{ f(p,LANG); }catch(e){} });
    pintaLang(); });
}
function pintaLang(){
  const _id=x=>document.getElementById(x);
  const t=T();
  _id('backMenu').textContent=t.menu; _id('keys').innerHTML=t.keys;
  _id('youlbl').textContent=t.you; _id('countYou').textContent=t.youIntro;
  ['bLaneL','bLaneC','bLaneR'].forEach((id,i)=>{ _id(id).querySelector('.t').textContent=t.lanes[i]; });
  _id('bRun').querySelector('.t').textContent=t.run; _id('bRun').querySelector('.k').textContent=t.runHold;
  _id('bBrake').querySelector('.t').textContent=t.brake; _id('bNitro').querySelector('.t').textContent=t.nitro;
  _id('bGhost').querySelector('.t').textContent=t.ghost; _id('bSup').querySelector('.t').textContent=t.sup;
  _id('specKey').innerHTML=t.specKey; _id('specExit').textContent=t.specExit; _id('err').textContent=t.err;
  const sb=_id('snd'); if(sb) sb.title=t.sound;
  if(arranque) arranque.refresh(); if(banner) banner.refresh();   //+AG el cartel de arranque y la banda del modo también viven en el idioma del shell
}
applyLang(params.get('lang'));

//+AG un solo camino para soltar la cuenta atrás (y con ella los beeps), lo pulse el jugador en "¡LISTO!" o lo
//   suelte el reloj del auto-arranque. Los beeps se programan de una vez con la MISMA cuenta que pintan los
//   números (DIGITS/DIGIT), así caen clavados aunque un frame se retrase.
function startCountdown(){
  phase='intro'; introT=0; introRingT=-1; clearTimeout(goT);
  document.getElementById('count').classList.add('show');
  if(sfxOn && audio.unlocked) sfxCountdown(audio, { digits:DIGITS, digitDur:DIGIT, goAt:INTRO_DUR });
  audio.stop(); startAudio();   //+AG ronda nueva: la música arranca YA, con el 3-2-1 (ver startAudio)
}

buildSim(seed);
if(EMBED){ const bm=document.getElementById('backMenu'); if(bm) bm.style.display='none'; }   //+AG en embed el shell gestiona el volver
if(params.get('capture')==='1'){ document.querySelector('.keys').style.display='none'; const _f=document.getElementById('fps'); if(_f) _f.style.display='none';
  document.getElementById('controls').style.display='none'; youLbl.style.display='none'; }   //+AG sin controles/etiqueta en captura de vídeo
else {
  //+AG doc 38 Fase 1: el boton #snd SOLO en standalone (ni captura ni embed). En el shell no existe.
  if(!EMBED){
    const sbtn=document.createElement('button'); sbtn.id='snd'; sbtn.textContent='🔇'; sbtn.title=T().sound;
    document.body.appendChild(sbtn);
    const upd=()=>{ const on=musicOn||sfxOn; sbtn.textContent=on?'🔊':'🔇'; sbtn.classList.toggle('on',on); };
    sbtn.onclick=async()=>{
      if(!audio.unlocked){ sbtn.classList.add('load'); await audio.unlock(); sbtn.classList.remove('load'); }
      const on=!(musicOn||sfxOn); musicOn=sfxOn=on; upd();
      if(on){ if(phase==='play') startAudio(); }   //+AG doc 38: NUNCA buildSim (residuo que REINICIABA la ronda); la musica entra donde este
      else { audio.stop(); }
    };
  } else {
    //+AG doc 38 Fase 1: DESBLOQUEO SIN BOTON en embed: primer input de juego (pointerdown/tecla) desbloquea WebAudio.
    //   Silencioso; si music/sfx estan OFF no suena. NUNCA reinicia la ronda.
    const onFirstGesture=async()=>{
      document.removeEventListener('pointerdown', onFirstGesture, true);
      document.removeEventListener('keydown', onFirstGesture, true);
      await audio.unlock();
      if(musicOn) startAudio();   //+AG la propia startAudio() decide: suena en 'intro' y en 'play', calla en 'ready'
    };
    document.addEventListener('pointerdown', onFirstGesture, true);
    document.addEventListener('keydown', onFirstGesture, true);
  }
  //+AG ARRANQUE (chassis/arranque.mjs) — SOLO EN EMBED, o sea en el juego de verdad: Luz Roja abría de golpe en
  //   3-2-1, sin decir qué modo era y sin que el sonido hubiera podido desbloquearse todavía (feedback Jaime
  //   2026-07-26). En standalone se entra directo a la cuenta atrás, como siempre: es la herramienta de vídeo.
  if(EMBED){
    arranque = createArranque({
      mode:'redlight', lang:()=>LANG, audio, sfxOn:()=>sfxOn,
      autoSec: TUTORIAL ? 0 : 5,              // CÓMO JUGAR: sin reloj, se entra cuando el jugador quiere
      onStart: ()=> startCountdown(),
    });
    banner = modeBanner({ mode:'redlight', lang:()=>LANG });
    audio.prefetch();                         // la música se decodifica desde ya: en el "¡YA!" tiene que estar lista
    phase='ready';
  }
  loop();
  if(arranque) arranque.show();
}

// ============================================================================
//+AG COACH "CÓMO JUGAR" (?tutorial=1): la máquina de pasos, el foco, la mano y la pausa viven en chassis/coach.mjs
//   (compartido por los 3 modos). Aquí solo van los TEXTOS y la LISTA DE PASOS de Luz Roja. El nivel sin peligro
//   lo pone la Sim (opts.tutorial). Sin ?tutorial=1 no se llama.
// ============================================================================
if(TUTORIAL)(function(){
  const CI={
    en:{ done:'Tutorial complete! 🎓', exit:'✕ Exit',
      steps:[ 'HOLD RUN while the light is GREEN',
        'Ram the BARRIER on green until it breaks, then cross it',
        'RED! Let go and stop (today nobody shoots… in a real match, they do)',
        'Coming in hot? Press BRAKE (F) for an emergency stop',
        'The WALL has a GAP: switch LANE to the open side',
        'Press ⚡ NITRO on green: a sprint',
        'Press 👻 GHOST: you pass through walls for a moment',
        'SUPER bar full, on the house! Press ⭐ SUPER',
        'Cross the FINISH line!' ] },
    es:{ done:'¡Tutorial completado! 🎓', exit:'✕ Salir',
      steps:[ 'MANTÉN CORRER mientras la luz esté en VERDE',
        'Embiste la BARRERA en verde hasta romperla y crúzala',
        '¡ROJO! Suelta y quédate quieto (hoy nadie dispara… en la partida real, sí)',
        '¿Vas lanzado? Pulsa FRENAZO (F) para clavarte',
        'El MURO tiene un HUECO: cambia de CARRIL al lado abierto',
        'Pulsa ⚡ NITRO en verde: un sprint',
        'Pulsa 👻 FANTASMA: atraviesas muros un instante',
        '¡Barra de SÚPER llena de regalo! Pulsa ⭐ SÚPER',
        '¡Cruza la META!' ] },
  };
  //+AG doc 49: los otros 18 idiomas del tutorial llegan en el paquete. createCoach lee i18n[lang()] en
  //   cada paso, asi que basta con meter la tabla dentro del MISMO objeto CI aunque ya este en marcha.
  alLlegarPack((p,l)=>{ if(p.redlightCoach) CI[l]=Object.assign({},CI.en,p.redlightCoach); });
  //+AG condiciones leídas de la Sim: correr en verde (runHeld), quieto en rojo (velocidad ~0), frenazo/boosters
  //   (ventanas pIn.*Until), carriles (pIn.lane), barrera (Y del jugador), meta (safe).
  //+AG pause:true = el mundo se congela mientras lees, y se suelta en cuanto tocas. Los pasos de MIRAR el juego
  //   (romper la barrera, aguantar el rojo, cruzar la meta) NO pausan ni tapan la pantalla: ahí la lección es ver.
  let acc=0, laneStart=null, laneMoved=false;
  const spd=()=>{ const p=sim.balls[0]; return Math.hypot(p.vx,p.vy); };
  //+AG el HUECO del muro ALTERNA de lado por nivel (BLOCKERS_BASE: y12 hueco a la derecha, y27 a la izquierda).
  //   El paso de carril señalaba ◀ fijo, o sea que la lección te mandaba justo contra el muro (feedback Jaime
  //   2026-07-25). Ahora se lee el muro que tienes DELANTE y la mano apunta al lado por el que se pasa.
  const gapSide=()=>{ const p=sim.balls[0], bl=(sim.blockers||[]).find(b=>b.y>p.y+0.8);
    return bl ? (bl.gap==='R'?'right':'left') : 'right'; };
  //+AG la luz la manda el COACH mientras enseña: verde para todo lo que se hace en movimiento y rojo SOLO en la
  //   lección de quedarse quieto. Antes te pedía nitro/fantasma/súper con la luz en rojo, que es cuando el juego
  //   te prohíbe moverte: la lección y la regla se contradecían (feedback Jaime 2026-07-25).
  const light=c=>()=>{ if(sim) sim.tutorialLight(c); };
  const andThen=(c,fn)=>()=>{ if(sim) sim.tutorialLight(c); fn(); };
  createCoach({
    mode:'redlight', i18n:CI, lang:()=>LANG,
    isPlaying:()=> !!sim && phase==='play',
    setPaused:v=>{ coachPaused=v; },
    steps:[
      { target:'bRun',   pause:true,  enter:light('green'),
        check:dt=>{ acc = (runHeld && sim.color==='green') ? acc+dt : acc; return acc>=2.0; } },
      { target:null,     pause:false, enter:light('green'), check:()=> sim.balls[0].y>7.5 },
      //+AG el ROJO llega CUANDO LO DICE EL CARTEL (no cuando toque el horario): la lección se ve en el momento
      { target:null,     pause:false, enter:light('red'),
        check:dt=>{ acc = (sim.color==='red' && !runHeld && spd()<0.3) ? acc+dt : 0; return acc>=1.2; } },
      { target:'bBrake', pause:true,  linger:1.4, enter:light('green'), check:()=> sim.f<sim.pIn.brakeUntil },
      { target:()=> gapSide()==='right' ? 'bLaneR' : 'bLaneL', pause:true, linger:1.0,
        enter:andThen('green', ()=>{ laneStart=sim.pIn.lane; laneMoved=false; }),
        check:()=>{ if(sim.pIn.lane!==laneStart) laneMoved=true; return laneMoved && sim.pIn.lane===gapSide(); } },
      { target:'bNitro', pause:true,  linger:1.6, enter:light('green'), check:()=> sim.f<sim.pIn.nitroUntil },
      { target:'bGhost', pause:true,  linger:1.6, enter:light('green'), check:()=> sim.f<sim.pIn.ghostUntil },
      { target:'bSup',   pause:true,  linger:1.8, enter:andThen('green', ()=>{ superVal=1; }), check:()=> sim.f<sim.pIn.superUntil },
      //+AG último paso: se SUELTA la luz. El horario normal vuelve y el examen final es el juego de verdad
      { target:null,     pause:false, enter:light(null),
        check:()=>{ const p=sim.balls[0]; return p.safe===true || (p.rank!==null && p.rank>0); } },
    ],
  });
})();
</script>
