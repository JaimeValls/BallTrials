<title>YouBall · Red Light Rush (WebGL) · The Marble Games</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#140a1e;font-family:system-ui,Segoe UI,sans-serif;color:#fff}
  /* v7: crepúsculo caramelo (apenas visible tras el suelo, pero coherente). ?art=old lo revierte por JS. */
  #bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 95% at 50% 30%,#4a1f5e 0%,#2a1440 55%,#160c22 100%)}
  canvas{display:block;position:fixed;top:0;left:0;z-index:0}
  /* anillo de HUD que tiñe el borde de verde/rojo/ámbar según el semáforo (sin tapar la acción) */
  #ring{position:fixed;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 90px 14px rgba(0,0,0,0);transition:box-shadow .12s}
  #ring.green{box-shadow:inset 0 0 90px 16px rgba(40,220,90,.34)}
  #ring.red{box-shadow:inset 0 0 175px 40px rgba(255,30,24,.72)}
  #ring.amber{box-shadow:inset 0 0 110px 20px rgba(255,180,20,.5)}
  /* destello de EJECUCIÓN (solo preview; el vídeo lleva el fogonazo WebGL): flash rojo a pantalla completa */
  #exflash{position:fixed;inset:0;z-index:3;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,rgba(255,40,30,.55),rgba(255,20,20,.28));opacity:0;transition:opacity .5s ease-out}
  #exflash.hit{opacity:1;transition:opacity 0s}
  /* farol/semáforo: siempre visible arriba-centro (referencia constante del estado, docs/44 §5) */
  /* bajado bajo la franja de supervivencia (canvas, arriba) para no solaparla en el preview */
  #farol{position:fixed;top:186px;left:50%;transform:translateX(-50%);z-index:6;display:flex;gap:10px;
    background:rgba(12,8,20,.62);padding:10px 14px;border-radius:18px;box-shadow:0 3px 14px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.10);pointer-events:none}
  #farol .lamp{width:32px;height:32px;border-radius:50%;background:#241f30;box-shadow:inset 0 0 7px rgba(0,0,0,.7);transition:background .08s,box-shadow .08s}
  #farol .lamp.on-green{background:#25e070;box-shadow:0 0 16px 4px rgba(40,225,110,.8),inset 0 0 6px rgba(255,255,255,.4)}
  #farol .lamp.on-amber{background:#ffbe18;box-shadow:0 0 16px 4px rgba(255,190,30,.85),inset 0 0 6px rgba(255,255,255,.5)}
  #farol .lamp.on-red{background:#ff2d2d;box-shadow:0 0 18px 5px rgba(255,50,50,.9),inset 0 0 6px rgba(255,255,255,.35)}
  /* HUD equipos arriba: BARRA de color = equipo · a su lado 3 casillas (bolas en meta, 0→3) */
  #top{position:fixed;left:0;right:0;top:10px;display:flex;justify-content:center;gap:14px;pointer-events:none;user-select:none;z-index:5}
  .tc{display:flex;align-items:center;gap:9px;background:rgba(0,0,0,.40);padding:6px 11px;border-radius:12px;transition:box-shadow .18s,background .18s}
  .tc.lead{background:rgba(255,255,255,.10);box-shadow:0 0 0 2px rgba(255,255,255,.22),0 0 16px rgba(255,214,110,.30)}
  .tc .disc{width:7px;height:22px;border-radius:4px}   /* BARRA vertical = identidad de equipo (no se confunde con un pip) */
  .tc .pips{display:flex;gap:5px;padding-left:3px;border-left:1px solid rgba(255,255,255,.18)}   /* separador claro de la barra */
  .tc .pip{width:13px;height:13px;border-radius:50%;box-sizing:border-box;border:2px solid rgba(255,255,255,.30);background:transparent}
  /* minimapa VERTICAL a la derecha: meta arriba, spawn abajo, 12 dots por su Y */
  #mini{position:fixed;right:16px;top:14%;bottom:14%;width:10px;border-radius:6px;z-index:5;
    background:linear-gradient(0deg,rgba(255,255,255,.05),rgba(255,255,255,.13))}
  #mini .fin{position:absolute;left:-4px;right:-4px;top:-3px;height:7px;border-radius:2px;
    background:repeating-linear-gradient(90deg,#f4f4f4 0 5px,#0c0c0c 5px 10px)}
  #mini .md{position:absolute;left:50%;width:13px;height:13px;border-radius:50%;transform:translate(-50%,50%);box-shadow:inset 0 -2px rgba(0,0,0,.3)}
  #mini .md.fin{box-shadow:0 0 0 2px #ffd34d,0 0 8px rgba(255,211,77,.7)}
  #mini .md.dead{opacity:.16;filter:grayscale(1)}
  .keys{position:fixed;left:14px;bottom:34px;font-size:12px;color:#7d7596;z-index:5}
  #snd{position:fixed;right:14px;bottom:30px;z-index:6;width:46px;height:46px;border-radius:50%;border:0;
    background:rgba(0,0,0,.42);color:#fff;font-size:22px;line-height:46px;cursor:pointer;
    box-shadow:0 0 0 2px rgba(255,255,255,.14);transition:transform .12s,box-shadow .18s,background .18s}
  #snd:hover{transform:scale(1.08)}
  #snd.on{background:rgba(120,80,255,.5);box-shadow:0 0 0 2px rgba(155,92,255,.6),0 0 16px rgba(120,80,255,.55)}
  #snd.load{opacity:.55}
  #snd:not(.on):not(.load){animation:sndpulse 2.2s ease-in-out infinite}
  @keyframes sndpulse{0%,100%{box-shadow:0 0 0 2px rgba(255,255,255,.14)}50%{box-shadow:0 0 0 2px rgba(255,255,255,.30),0 0 14px rgba(255,255,255,.18)}}
  #err{position:fixed;inset:0;display:none;place-items:center;padding:24px;color:#ffb4b4;text-align:center;z-index:9}
  #fps{position:fixed;left:10px;top:10px;z-index:8;font:12px/1.3 monospace;color:#8fe;background:rgba(0,0,0,.45);padding:3px 7px;border-radius:6px;pointer-events:none}
  /* HUD del SHORT individual: fila de pips (1 por color) arriba = quién sigue en carrera. DOM → sale en la captura
     (page.screenshot). Solo visible con ?short=1. */
  /* SHORT: fila de pips que se GRABA (page.screenshot a 1080×1920) → es el HUD del vídeo. Dimensionado por vw
     (= lado MENOR en 9:16) con clamp: legible a 1080, sin inflarse en preview pequeño ni apaisado. Coherente con el censo. */
  #pips{position:fixed;left:0;right:0;top:clamp(12px,1.4vw,20px);display:none;justify-content:center;gap:clamp(10px,1.7vw,20px);z-index:6;pointer-events:none}
  #pips .pip{width:clamp(15px,3.2vw,38px);height:clamp(15px,3.2vw,38px);border-radius:50%;box-shadow:0 1px 4px rgba(0,0,0,.6),inset 0 0 0 2px rgba(255,255,255,.35);transition:opacity .2s,filter .2s}
  /* CTA like/suscríbete: solo al coronar al ganador (icónico, sin texto). Animado por JS por frame (determinista en captura). */
  #cta{position:fixed;bottom:7.5%;left:50%;display:flex;align-items:center;gap:.34em;z-index:7;opacity:0;pointer-events:none;transform-origin:center bottom;font-size:4.3vh}
  #cta .ic{display:flex;align-items:center;gap:.24em;background:rgba(8,6,16,.62);padding:.14em .5em;border-radius:.5em;box-shadow:0 4px 16px rgba(0,0,0,.5)}
  #cta .thumb{display:inline-block;transform-origin:center}
  #cta .bell{display:inline-block;transform-origin:50% 16%}
  #cta .sp{font-size:.56em;filter:drop-shadow(0 0 8px rgba(255,215,90,.95))}
  /*+AG CONTROLES del jugador (port del Cazador): fila de CARRILES (intención, arriba) + fila de acciones con
     CORRER y PARAR dominantes y los 3 boosters (Nitro/Fantasma/Súper) con recarga .cd. Touch-first.
     ⚠ doc 73 (2026-08-04, VB Jaime): SE ACABÓ EL MANTENER PULSADO. CORRER era un `hold` —el dedo clavado en el
     botón toda la carrera— y eso hacía el modo incómodo de manejar: para tocar un carril o un booster había que
     soltar CORRER (= frenar sin querer) o jugar con dos dedos, y el `hold` además es frágil (si se pierde el
     `pointerup` te quedas corriendo; costó un fallo real esta misma mañana). Ahora son DOS ESTADOS: CORRER
     enciende el motor y se queda encendido, PARAR lo apaga. El pulgar queda libre para el resto del HUD. */
  #controls{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:flex;flex-direction:column;gap:7px;
    width:min(560px,94vw);font-family:'Segoe UI Rounded','Nunito',system-ui,sans-serif;user-select:none;touch-action:none}
  #controls .row{display:flex;gap:8px}
  /* ═══ doc 85 · EL BOTÓN DE PARTIDA, AL IDIOMA DE BRAWL (mismo bloque que la Carrera y el Cazador).
     El canto era `0 4px 0 #0009` —negro translúcido— y sobre el naranja de la pista de este modo se
     perdía del todo. Aquí es sólido y suyo (`--j-canto`), más bisel arriba, sombra interior abajo y
     sombra proyectada. `min-height:44px` es la regla 14 del doc 60: los tres CARRILES medían 30 px en
     el móvil de verdad, que es el peor incumplimiento de dedo de todo el juego. */
  #controls button{--j-canto:#120a24;--j-tinte:#ffffff;
    border:0;border-radius:16px;min-height:44px;font-family:inherit;font-weight:900;color:#fff;cursor:pointer;
    box-shadow:0 5px 0 var(--j-canto), inset 0 2px 0 #ffffff33, inset 0 -3px 0 #00000055, 0 6px 14px #00000055;
    transition:transform .05s,filter .1s,box-shadow .08s;line-height:1.05;backdrop-filter:blur(3px)}
  #controls button:active:not(.off){transform:translateY(4px) scale(.985);
    box-shadow:0 1px 0 var(--j-canto), inset 0 2px 0 #ffffff33, 0 2px 6px #00000055;filter:brightness(1.16)}
  #controls button .k{display:block;font-size:9px;opacity:.55;font-weight:800;margin-top:3px;letter-spacing:.08em}
  #controls button .cd{display:block;font-size:11px;opacity:.8;font-weight:800}
  /*+AG encargo 34: EL ICONO DEL BOOSTER, encima de la palabra. En `em` (docs/57: nunca en px) para que crezca
     con la letra del boton, que es un clamp: 2.2em sobre los 10 px de un movil de 360 = 22 px, dentro del
     20-24 px al que el brief exige que la pieza se lea. */
  #controls button .bi{display:block;height:1.95em;width:auto;margin:0 auto;
    filter:drop-shadow(0 1px 1px #00000066)}
  /* con el icono puesto, los 5 botones de la fila de accion tenian su contenido a 3 alturas distintas
     (CORRER arriba del todo, FRENAZO en medio, los boosters mas abajo) porque el alto lo manda CORRER y
     cada uno empezaba en su padding. Centrado, la fila vuelve a leerse como una fila. */
  /*+AG doc 85 · EL HUECO ENTRE EL RÓTULO Y EL PIE. Medido: eran 0 px, las dos cajas se tocaban. Con el
     trazo de .11em no se notaba; con el de .14em que pidió Jaime («trazos gordos») los contornos se
     pisan y en la captura se lee «SÚPER» encima de su propio pie. El contorno pinta HACIA FUERA de la
     caja, así que el hueco tiene que ser mayor que el trazo: 2,24 px a 16 px de cuerpo → 3 px de gap.
     Es la misma lección del doc 56 §3bis.1 («INDMDUAL»), pero en vertical. */
  #controls .row:not(#laneRow) button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
  /* el FANTASMA es blanco-azulado y su boton es BLANCO cuando esta disponible: sin separarlo, la silueta se
     funde con la placa. Se le refuerza el contorno con la misma sombra doble que usa la insignia de liga. */
  /* ⚠ el selector lleva `#controls button` delante A PROPOSITO: la regla de arriba es `#controls button .bi`
     (id + etiqueta + clase) y le gana en especificidad a un `#bGhost .bi` suelto — la misma trampa que ya
     costo una version muerta en la Carrera (ver la nota de #ctr #bL). */
  #controls button#bGhost .bi{filter:drop-shadow(0 0 1px #160a38cc) drop-shadow(0 1px 2px #00000055)}
  /*+AG carriles (intención, estilo intenciones del Cazador): el activo lleva .on */
  /* los CARRILES son la intención de este modo y se tocan constantemente. Medían 107×30 px: el peor
     objetivo táctil del juego, por debajo del mínimo de 44 (doc 60 r.14). El cuerpo sube de 11 a 13. */
  #laneRow button{flex:1;padding:11px 4px;min-height:46px;font-size:clamp(13px,3.4vw,16px);
    background:linear-gradient(180deg,#3a3050,#241c3a 50%,#1a1430);--j-tinte:#c9beff}
  #laneRow button.on{background:linear-gradient(180deg,#b0a3ff,#6f5be6 55%,#5443c4);
    box-shadow:0 5px 0 #4133a0, inset 0 2px 0 #ffffff66, inset 0 -3px 0 #00000044, 0 0 15px #9b8cff66}
  /*+AG doc 73: los DOS MANDOS del modo, del mismo tamaño y uno al lado del otro. El ancho sale de repartir lo que
     tenía CORRER solo (2.6) más el hueco del FRENAZO (1) entre los dos → la fila no crece ni un píxel y los
     boosters conservan su ancho. `nowrap` porque en alemán/holandés la palabra es larga (RENNEN/STOPPEN) y si
     parte en dos líneas SUBE el alto del HUD, que es lo único que no cabe en un móvil de 360×640. */
  /*+AG doc 85: 14 px estaba fuera de la escala del doc 60 regla 8 (11/13/16/20/24). Sube a 16-20, que
     son dos peldaños de la escala, y son los dos mandos que más se miran del modo. */
  #bRun,#bStop{flex:1.9;padding:16px 4px;font-size:clamp(16px,4.4vw,20px);white-space:nowrap}
  #bRun{background:linear-gradient(180deg,#357f59,#1d4d36 55%,#163a29);box-shadow:0 5px 0 #143526, inset 0 2px 0 #ffffff2e, inset 0 -3px 0 #00000044;--j-tinte:#8ff0c4;--j-canto:#143526}
  /* ENCENDIDO = el estado, no el dedo: mientras el motor va, CORRER se queda vivo aunque no lo estés tocando.
     Es la única señal de "estoy corriendo" que tiene el jugador ahora que no hay dedo puesto, así que el apagado
     es DE VERDAD apagado (verde sucio, hundido) y el encendido canta. */
  #bRun.on{background:linear-gradient(180deg,#78f5ac,#2bb869 55%,#1f9455);box-shadow:0 5px 0 #14663a,0 0 22px #3ad07acc, inset 0 2px 0 #ffffff66, inset 0 -3px 0 #00000033}
  /* corriendo EN ROJO: el motor sigue dado en zona prohibida. Se pinta rojo, pero APAGADO y sin halo, y no
     es un capricho: medido en captura, con el rojo brillante de antes los DOS mandos grandes gritaban a la
     vez sobre un fondo que el semáforo ya tiñe entero de rojo, y el jugador tenía dos alarmas y ninguna
     instrucción. Aquí el rojo de CORRER dice «esto que estás haciendo es peligroso» y el que canta es
     PARAR, que es la tecla que hay que tocar. Ese rojo vivo lo lleva UNO solo. */
  #bRun.on.red{background:linear-gradient(180deg,#b8463a,#7a1f16 55%,#5e160f);box-shadow:0 5px 0 #4d1109, inset 0 2px 0 #ffffff33, inset 0 -3px 0 #00000044}
  #bStop{background:linear-gradient(180deg,#6d2a3b,#3a1220 55%,#2c0d19);box-shadow:0 5px 0 #2a0c16, inset 0 2px 0 #ffffff2e, inset 0 -3px 0 #00000044;--j-tinte:#ffa596;--j-canto:#2a0c16}
  #bStop.on{background:linear-gradient(180deg,#ff6673,#9e0f22 55%,#7d0b1a);box-shadow:0 5px 0 #66091a, inset 0 2px 0 #ffffff55, inset 0 -3px 0 #00000033}
  /* AVISO: en cuanto el semáforo se pone ámbar (o ya rojo) y TÚ sigues corriendo, el que late es PARAR — se le
     dice al jugador lo que TIENE QUE HACER, no lo que no debe. Late sin barrido: el barrido de brillo es del
     SÚPER y en este juego solo lo lleva uno (regla Supercell: si avisan todos, no avisa ninguno). */
  /* la INVITACIÓN de salida: CORRER late en verde hasta que el jugador lo estrena. Mismo latido de
     tamaño que el aviso de PARAR (lo que se ve sobre cualquier fondo es que algo se mueva), en el color
     que ya tiene el botón: no se le añade un cartel al HUD, se le señala el botón que ya está ahí. */
  #bRun.urge{background:linear-gradient(#5aec97,#2bb869);box-shadow:0 4px 0 #14663a,0 0 26px #ffffff55, inset 0 1px 0 #ffffff55;
    animation:urgeGlow 0.62s ease-in-out infinite}
  #bStop.urge{background:linear-gradient(#ff8f80,#f0402c);box-shadow:0 4px 0 #8a2016,0 0 26px #ffffff55, inset 0 1px 0 #ffffff55;
    animation:urgeGlow 0.62s ease-in-out infinite}
  /* el latido es de TAMAÑO, no solo de halo: cuando el semáforo se pone rojo el juego tiñe la pantalla
     entera de rojo, y un halo rojo sobre fondo rojo no se ve. Lo que sí se ve siempre es que algo se mueva. */
  @keyframes urgeGlow{0%,100%{transform:scale(1);filter:drop-shadow(0 0 0 #ffffff00)}
                      50%{transform:scale(1.045);filter:drop-shadow(0 0 12px #ffffffaa)}}
  @media (prefers-reduced-motion:reduce){#bStop.urge{animation:none}}
  #bNitro,#bGhost,#bSup{flex:1;padding:9px 3px;font-size:clamp(13px,3.2vw,16px);
    background:linear-gradient(180deg,#3a3050,#241c3a 50%,#1a1430)}
  /* cada booster teñido también EN REPOSO, no sólo cuando está listo: eran tres placas iguales para
     tres cosas distintas. Los colores son los que este modo ya tenía en .ready/.act (doc 73). */
  #controls #bNitro{--j-tinte:#59e0ff;background:linear-gradient(180deg,#2b6b8a,#1d4d66 50%,#143a4e);--j-canto:#0a2532}
  #controls #bGhost{--j-tinte:#ffffff;background:linear-gradient(180deg,#4a5068,#343a4e 50%,#252a3a);--j-canto:#171b26}
  #controls #bSup{--j-tinte:#ffd23f;background:linear-gradient(180deg,#6d5526,#4e3c1c 50%,#382b14);--j-canto:#241a08}
  /*+AG CADA BOTÓN DEL COLOR DE SU SIGNIFICADO (VB Jaime 2026-07-25). En este modo el color YA es la mecánica
     (semáforo), así que los controles hablan el mismo idioma: CORRER verde, PARAR rojo de luz de freno, NITRO
     cian = la estela de velocidad del motor, FANTASMA blanco = intangible (en pista la bola se vuelve
     translúcida), SÚPER oro = acción, la convención del juego. Los dos mandos grandes se apagan cuando NO son
     tu estado: en todo momento hay exactamente uno encendido, y de un vistazo sabes si tu motor va o no. */
  /* ⚠⚠ 2026-08-07 · EL SELECTOR DE ESTADO LLEVA `#controls` DELANTE Y NO ES ADORNO. Al teñir los tres
     boosters en reposo (doc 85) se escribió `#controls #bNitro` — DOS ids — y eso le gana a
     `#bNitro.ready` y a `#bNitro.act`, que son un id y una clase. Resultado: la placa de reposo se
     quedaba puesta también encendida y lista… pero la TINTA del `.act` sí se aplicaba, y esa tinta es
     oscura a propósito (`#032230`) porque el fondo del `.act` era cyan CLARO, y encima la excepción
     de más abajo le quita el trazo. Letra oscura, sin contorno, sobre placa oscura.
     Jaime, viéndolo: «tiene trazo negro y fondo negro y no se lee bien». Medido: contraste 1,81.
     Es la MISMA trampa de especificidad que este fichero ya documenta dos veces (ver la nota de
     `#controls button#bGhost .bi`), pero al revés: esta vez el selector nuevo era demasiado fuerte.
     REGLA: si el reposo lleva `#controls #bX`, sus estados llevan `#controls #bX.estado`. */
  #controls #bNitro.ready{background:linear-gradient(#59e0ff,#1f9ec8);box-shadow:0 4px 0 #0f5e7c, inset 0 1px 0 #ffffff30}
  #controls #bNitro.act{background:linear-gradient(#a8f2ff,#3fc2ea);color:#032230;box-shadow:0 2px 0 #0f5e7c,0 0 20px #59e0ffcc, inset 0 1px 0 #ffffff50}
  /*+AG el FANTASMA era lila y el CARRIL activo también (#laneRow button.on): dos violetas para cosas que no tienen
     nada que ver. En blanco deja de confundirse y además dice lo que hace: atravesar. Texto oscuro: el color base
     de los controles es blanco y sobre fondo claro no se leería. */
  #controls #bGhost.ready{background:linear-gradient(#ffffff,#dbe1f0);color:#141b2e;box-shadow:0 4px 0 #878ea6, inset 0 1px 0 #ffffff80}
  #controls #bGhost.act{background:linear-gradient(#ffffffdd,#dfe6f5b0);color:#141b2e;box-shadow:0 2px 0 #878ea6,0 0 22px #ffffffcc, inset 0 1px 0 #ffffff70}
  /*+AG doc 40: mismo lenguaje de "listo para pulsar" que el resto del juego (glow que late + barrido de brillo).
     Aqui SOLO el super lo lleva: freno/nitro/fantasma tambien usan .ready para decir "disponible", y si los
     cuatro barrieran a la vez el aviso dejaria de significar nada (regla Supercell: uno por pantalla). */
  #controls #bSup.ready{background:linear-gradient(#ffe27a,#ff9a3d);color:#3a2400;box-shadow:0 3px 0 #a85a12,0 0 18px #ffb03daa;
    position:relative;overflow:hidden;animation:readyGlow 1.9s ease-in-out infinite}
  #bSup.ready::after{content:'';position:absolute;top:0;height:100%;width:32%;left:-45%;
    background:linear-gradient(100deg,#fff0,#ffffff88 46%,#fff0);transform:skewX(-18deg);
    animation:readySweep 3.2s ease-in-out infinite;pointer-events:none}
  #controls #bSup.act{background:linear-gradient(#fff3b8,#ffc44d);color:#3a2400;box-shadow:0 2px 0 #a85a12,0 0 26px #ffd34dee, inset 0 1px 0 #ffffff60}
  #bSup.act::after{display:none}
  @keyframes readySweep{0%{left:-45%}26%,100%{left:132%}}
  @keyframes readyGlow{0%,100%{filter:drop-shadow(0 0 0 #ffd23f00)}50%{filter:drop-shadow(0 0 10px #ffd23fcc)}}
  @media (prefers-reduced-motion:reduce){#bSup.ready,#bSup.ready::after{animation:none}}
  /* ⚠ ES `.off` Y NO `:disabled` (ver doc 85). Un <button disabled> no recibe el evento: el navegador
     se come el toque antes de que llegue el juego, así que un booster en recarga no podía ni contestar
     "ahora no". Y el apagado deja de ser opacity .4, que borraba el icono y con él la pista de qué es. */
  /* ⚠⚠ 2026-08-07 (2ª vuelta) · EL APAGADO DEJA DE SER UN FILTRO. Jaime, viéndolo: «tiene trazo negro
     y fondo negro y no se lee bien». Tenía razón y la culpa era de este mismo bloque: el apagado se
     hacía con `filter:grayscale(.55) brightness(.72)`, y un filtro se lo come TODO — la placa, la
     letra y el contorno a la vez. Sobre una placa que ya era oscura (el nitro es azul petróleo) el

  #controls button, #youlbl, #spectator .big, #specExit{

     JUGAR, las monedas, la compra: arte YA APROBADO— corre a .25em, o sea que el HUD era menos de la
     mitad de grueso que la superficie con la que tiene que hacer juego. Sube a .14em, que sigue dentro

  #controls button{-webkit-text-stroke-width:.14em;letter-spacing:.05em}

  #controls #bSup.ready, #controls #bSup.act, #specExit{color:#fff}

  #controls #bGhost.ready, #controls #bGhost.act, #controls #bNitro.act{-webkit-text-stroke-width:0;text-shadow:none}
  /* doc 60 regla 9 · SUELO DE 11 px: ningun texto informativo del HUD baja de ahi. Los 10 y 9 px de este
     HUD venian de cuando el HUD era una herramienta de preview en pantalla grande. */
  #controls button .k{font-size:11px}
  #bNitro,#bGhost,#bSup{font-size:clamp(11px,2.7vw,14px)}   /* el minimo era 10 px */
  /* doc 60 regla 10 · MAYUSCULAS POR CSS, nunca editando los 20 diccionarios de i18n (en arabe/CJK el
     transform es inocuo). Los botones de este modo ya venian en mayusculas escritas a mano; con el
     transform lo siguen estando cuando el paquete de idioma los traduce. La frase larga de
     #spectator .sub se queda en Sentence case. */
  #controls button, #count .you, #spectator .big, #specExit{text-transform:uppercase}
  /* ATAJOS DE TECLADO. Medido: los sufijos «←/1», las teclas de CORRER/PARAR, las letras F/A/S de recarga y la
     leyenda de teclas de la esquina se pintan SIEMPRE — lo unico que los apagaba era ?capture=1 —, o sea
     que en el movil de verdad (embed del shell) el jugador ve teclas que no tiene. NO se borran: en
     escritorio se juega con el teclado y ayudan. Se apagan donde no hay teclado (puntero grueso = dedo).
     ✔ doc 73: #bRun YA NO es una excepcion. Su .k decia «MANTÉN · espacio/↑» —instruccion y teclas mezcladas—
       y por eso no se podia apagar en el movil sin llevarse por delante la unica pista de que habia que dejar
       el dedo puesto. Ya no hay dedo puesto que explicar: su .k son solo teclas, como los demas, y se apaga
       donde no hay teclado. Se cierra la deuda que este comentario dejaba escrita. */
  @media (pointer:coarse){ #controls button .k, .keys{display:none} }
  /* ═══ doc 85 · «EFECTOS REDUCIDOS» APAGA TAMBIÉN LOS BRILLOS DEL HUD ═════════════════════════
     El ajuste del juego viajaba al motor por `&redfx=1` y sólo bajaba el pixelRatio: el barrido del
     súper, el latido y las respiraciones seguían corriendo. O sea que un jugador que pide menos
     movimiento seguía teniendo la parte del HUD que más se mueve. `prefers-reduced-motion` sí los
     apagaba, pero es el ajuste del SISTEMA, no el del juego, y no todo el mundo lo tiene puesto. */
  html.redfx #bSup.ready, html.redfx #bSup.ready::after, html.redfx #bRun.urge, html.redfx #bStop.urge,
  html.redfx #controls button.j-hit, html.redfx #controls button.j-roce, html.redfx #controls button.j-deny{animation:none}
  html.redfx #controls button.j-hit{filter:brightness(1.9)}

/*+AG ?drive=1 (verificacion DOM/JS, docs/34): cuando el pane/iframe NO compone frames, el rAF nativo nunca
   dispara y el juego no avanza. Este script CLASICO (corre ANTES que el modulo) encola los callbacks de rAF
   y falsea performance.now; window.__driveFrames(n) bombea n frames sinteticos a 60fps desde consola/tests.
   Sin ?drive=1 es un no-op total. NO toca la Sim ni el determinismo (solo el reloj del render). */
if(new URLSearchParams(location.search).get('drive')==='1'){
  window.__rafQ=[]; window.__drvT=1000;
  window.requestAnimationFrame=function(cb){ window.__rafQ.push(cb); return window.__rafQ.length; };
  window.cancelAnimationFrame=function(){};
  performance.now=function(){ return window.__drvT; };
  window.__driveFrames=function(n){ for(var i=0;i<n;i++){ window.__drvT+=1000/60; var q=window.__rafQ.splice(0); for(var k=0;k<q.length;k++){ q[k](window.__drvT); } } return window.__drvT; };
}
</script>

// ---- damero de la LÍNEA DE META ------------------------------------------------------------------------------
// v8 (feedback del dueño 2026-07-19: "la línea de meta parece una barrera"): antes era una tira de 0.6 u con un
// damero diminuto → a distancia se leía como un listón más, indistinguible de la barrera rompible. Ahora es una
// BANDA ANCHA (2.4 u) de dos filas de cuadros GRANDES (~1.2 u de lado, el tamaño de una bola y media), que es
// como se lee una meta de un vistazo. El damero se dibuja con la geometría, no con repeat de textura, para que
// los cuadros midan lo mismo en unidades de mundo pase lo que pase con el zoom.
const GATE_DEPTH = 2.4, GATE_SQ = 1.2;                  // profundidad de la banda y lado del cuadro (unidades)
function checkerBand(widthU, depthU, sq){
  const cols = Math.max(2, Math.round(widthU/sq)), rows = Math.max(2, Math.round(depthU/sq));
  const c=document.createElement('canvas'); c.width=cols*16; c.height=rows*16; const x=c.getContext('2d');
  for(let r=0;r<rows;r++) for(let i=0;i<cols;i++){ x.fillStyle=((i+r)&1)?'#101010':'#f7f7f7'; x.fillRect(i*16,r*16,16,16); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.magFilter=THREE.NearestFilter; return t; }

// ---- PISTA v7.1: terracota PLANA con un brillo suave central (vignette, SIN líneas horizontales → se lee claro
//      qué es área jugable). Feedback del dueño: menos líneas, más plano pero bonito. ----
function trackTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  const g=x.createRadialGradient(128,110,20,128,128,180); g.addColorStop(0,ART.track[1]); g.addColorStop(1,ART.track[0]);
  x.fillStyle=g; x.fillRect(0,0,256,256);
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return crispen(t); }
function bannerTex(dir){ const c=document.createElement('canvas'); c.width=64;c.height=64; const x=c.getContext('2d');
  const cols=ART.banner; for(let i=0;i<4;i++){ x.fillStyle=cols[i%cols.length]; const y=i*16;
    x.beginPath(); if(dir>0){ x.moveTo(0,y); x.lineTo(0,y+16); x.lineTo(52,y+8); } else { x.moveTo(64,y); x.lineTo(64,y+16); x.lineTo(12,y+8); }
    x.closePath(); x.fill(); }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapT=THREE.RepeatWrapping; return t; }

// ---- arena estática: suelo (delantal + pista), muros, banderines, zona de meta ----

  const gate=new THREE.Mesh(new THREE.PlaneGeometry(FIELD_W,GATE_DEPTH),

}

// MINA: se lee como "no pares aquí". Dibujada UNA vez en un canvas (pinchos + cuerpo + núcleo rojo) y compartida
// como TEXTURA en todas → 2 meshes por mina (sprite + halo) en vez de ~12 → mucho menos coste de render.
function mineTex(){ const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d'); const C=128;
  const spike=ARTV?ART.mineSpike:'#aab2c0', body=ARTV?ART.mineBody:'#2b2f3a', ring=ARTV?ART.mineRing:'#5b6474';
  x.strokeStyle=spike; x.lineWidth=18; x.lineCap='round';   // 8 pinchos (2× resolución → nítidos)
  for(let i=0;i<8;i++){ const a=i/8*Math.PI*2; x.beginPath(); x.moveTo(C+Math.cos(a)*60,C+Math.sin(a)*60); x.lineTo(C+Math.cos(a)*104,C+Math.sin(a)*104); x.stroke(); }
  x.fillStyle=body; x.beginPath(); x.arc(C,C,68,0,7); x.fill();                     // cuerpo
  x.strokeStyle=ring; x.lineWidth=12; x.beginPath(); x.arc(C,C,58,0,7); x.stroke(); // aro
  x.fillStyle='#5a1216'; x.beginPath(); x.arc(C,C,30,0,7); x.fill();                 // núcleo oscuro (se queda)
  x.fillStyle='#ff3a28'; x.beginPath(); x.arc(C,C,14,0,7); x.fill();                 // luz ROJA (señal: se queda)
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return crispen(t); }
const MINE_TEX=mineTex();
const matMineSprite=new THREE.MeshBasicMaterial({ map:MINE_TEX, transparent:true, depthWrite:false, toneMapped:false });
function mineMesh(){ const g=new THREE.Group();
  const sprite=new THREE.Mesh(new THREE.PlaneGeometry(2.1,2.1), matMineSprite); sprite.position.z=0.05; g.add(sprite);
  const glow=new THREE.Mesh(new THREE.CircleGeometry(1.0,16), new THREE.MeshBasicMaterial({color:DANGER,toneMapped:false,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false})); glow.position.z=0.04; glow.layers.enable(BLOOM); g.add(glow);
  g.userData={glow}; return g; }

// texturas de aviso/ladrillo horneadas UNA vez y compartidas (sin clonar; el clon era el "artefacto negro")
// RAYAS DE PELIGRO (bloqueador): alta resolución + SEAMLESS + se TESELA (no se estira) → nítidas a cualquier ancho.
function stripeTex(){ const S=256; const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
  x.fillStyle=ARTV?ART.chevronBg:'#4a5262'; x.fillRect(0,0,S,S);
  x.strokeStyle=ARTV?ART.chevron:'#e8b41e'; x.lineWidth=S*0.28; x.lineCap='butt';
  for(let i=-S;i<=S;i+=S/2){ x.beginPath(); x.moveTo(i,S); x.lineTo(i+S,0); x.stroke(); }   // diagonales 45°, periodo S/2 → seamless
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.wrapS=t.wrapT=THREE.RepeatWrapping; return crispen(t); }
function brickTex(){ const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  x.fillStyle='#8a6b4a'; x.fillRect(0,0,64,64); x.strokeStyle='#4a3626'; x.lineWidth=3;   // LADRILLOS pequeños
  for(let r=0;r<4;r++){ const off=(r%2)*8; x.beginPath(); x.moveTo(0,r*16); x.lineTo(64,r*16); x.stroke();
    for(let cc=0;cc<4;cc++){ x.beginPath(); x.moveTo(off+cc*16,r*16); x.lineTo(off+cc*16,r*16+16); x.stroke(); } }
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return t; }
const STRIPE_TEX=stripeTex(), BRICK_TEX=brickTex();

// BLOQUEADOR de media pista: 1 losa con rayas de aviso. La textura se TESELA por el ancho (no se estira) → nítida.

function blockerMesh(cx, width, thick){ STRIPE_TEX.repeat.set(width/3.2, 1);   // ~raya cada 1.5u; todos los bloqueadores tienen el mismo ancho
  const slab=new THREE.Mesh(new THREE.BoxGeometry(width,thick,1.7),matBlocker); slab.position.set(cx,0,0.85); return slab; }

// BARRERA ROMPIBLE. v7.2 (feedback del dueño): en vez de UNA losa fea, una REJILLA de ladrillitos de HIELO; solo
// se rompen los que TOCA el pelotón (por la X de la bola que embiste) y cada uno BRILLA y ESTALLA al romperse.
// (La sim la trata como una pieza sólida con HP compartida; esto es puro render: reparto el HP en ladrillos.)
const BRICK_COLS=10, BRICK_ROWS=2;
function barrierMesh(halfw, thick){ const g=new THREE.Group();
  if(ARTV){
    const mat=new THREE.MeshStandardMaterial({ color:ART.ice, roughness:0.14, metalness:0.0, transparent:true, opacity:0.9, emissive:0x3aa0c8, emissiveIntensity:0.35 });
    const gap=0.12, bw=(halfw*2)/BRICK_COLS, bh=thick/BRICK_ROWS, bz=1.05;
    const geo=new THREE.BoxGeometry(bw-gap, bh-gap*0.5, bz); const bricks=[];
    for(let cx=0;cx<BRICK_COLS;cx++) for(let ry=0;ry<BRICK_ROWS;ry++){
      const lx=-halfw+bw*(cx+0.5), ly=-thick/2+bh*(ry+0.5);
      const m=new THREE.Mesh(geo,mat); m.position.set(lx,ly,bz/2+0.02); g.add(m);
      bricks.push({m,x:lx,y:ly,row:ry,alive:true}); }
    g.userData={ice:true,mat,bricks,aliveCount:bricks.length,total:bricks.length};
  } else {
    const m=new THREE.MeshStandardMaterial({ map:BRICK_TEX, roughness:0.85, metalness:0.05, emissive:0x000000 });
    const slab=new THREE.Mesh(new THREE.BoxGeometry(halfw*2, thick, 1.9), m); slab.position.z=0.95; g.add(slab);
    g.userData={slab,mat:m,ice:false};
  }
  return g; }
// rompe UN ladrillo: el vivo más cercano (en X) a una bola que embiste (o el central), fila sur primero. BRILLA+ESTALLA.
function breakBrick(group, bar){ const ud=group.userData; if(ud.aliveCount<=0) return;
  let ballX=null, bd=1e9;
  for(const b of sim.balls){ if(b.rank===-1||b.safe) continue;
    if(Math.abs(b.y-bar.y)<1.5 && Math.abs(b.x-bar.xc)<12 && b.y<bar.y+0.6){ const d=Math.abs(b.y-bar.y); if(d<bd){bd=d;ballX=b.x;} } }
  let best=null,bs=1e9; for(const br of ud.bricks){ if(!br.alive) continue; const wx=bar.xc+br.x;
    const s=(ballX!=null?Math.abs(wx-ballX):Math.abs(wx-bar.xc))+br.row*0.4; if(s<bs){bs=s;best=br;} }
  if(!best) return; best.alive=false; best.m.visible=false; ud.aliveCount--;
  const wx=bar.xc+best.x, wy=bar.y+best.y;
  flashAt(wx,wy,0xe4f6ff,1.0,0.95); P.burst(wx,wy,0.4,[0.8,0.96,1.0],15,6.5); P.burst(wx,wy,0.32,[1,1,1],8,4.2); P.ring(wx,wy,[0.7,0.95,1.0],0.5); }

// MIRILLA de francotirador (aparece sobre la bola PILLADA moviéndose en rojo). REDISEÑO v7.1 (feedback del dueño
// 2026-07-08): un MEDIDOR de peligro ROJO que se LLENA progresivamente mientras la bola se mueve en rojo; el disco
// interior CRECE hasta llenar el aro y, al llenarse (charge→1), DISPARA. Todo rojo (peligro), sin amarillo.
const scopeMat=c=>new THREE.MeshBasicMaterial({color:c,toneMapped:false,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
function scopeMesh(){ const g=new THREE.Group();
  const ring=new THREE.Mesh(new THREE.RingGeometry(0.94,1.10,48), scopeMat(0xff1818)); g.add(ring);      // aro de referencia (el "tope")
  const fill=new THREE.Mesh(new THREE.CircleGeometry(0.94,36),   scopeMat(0xff2a2a)); fill.position.z=-0.01; g.add(fill);   // disco que CRECE = la carga
  for(let k=0;k<4;k++){ const a=k*Math.PI/2, tick=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.11), scopeMat(0xff5a44));
    tick.position.set(Math.cos(a)*1.28,Math.sin(a)*1.28,0); tick.rotation.z=a; g.add(tick); }   // marcas de mira (fuera del aro)
  g.traverse(o=>{ if(o.isMesh) o.layers.enable(BLOOM); }); g.renderOrder=8; g.visible=false; g.userData={ring,fill}; return g; }
const scopePool=[]; for(let i=0;i<6;i++){ const s=scopeMesh(); scene.add(s); scopePool.push(s); }

// HAZ vertical del francotirador. Va en el CANVAS (aditivo) → SÍ aparece en el vídeo capturado, a diferencia
// de un overlay DOM. Dos usos: (1) telegrafía del apuntado — fino, sigue a la bola, se aviva con el lock;
// (2) DISPARO — ancho y blanco, un fogonazo que se abre y desvanece. Alto fijo (cubre la columna en 16:9 y 9:16).
const BEAM_H=72;
function beamMesh(){ const m=new THREE.Mesh(new THREE.PlaneGeometry(1,BEAM_H), scopeMat(0xff2a2a));
  m.layers.enable(BLOOM); m.renderOrder=6; m.visible=false; m.userData={life:-1}; scene.add(m); return m; }
const aimBeams=[]; for(let i=0;i<6;i++) aimBeams.push(beamMesh());          // telegrafía (persistente, index-alineado a scopePool)
const firePool=[]; for(let i=0;i<6;i++) firePool.push(beamMesh()); let fireHead=0;   // disparo (fire-and-fade)
function beamShoot(x,y){ const m=firePool[fireHead]; fireHead=(fireHead+1)%firePool.length;
  m.material.color.set(0xffffff); m.position.set(x,y,0.52); m.scale.set(3.2,1,1); m.material.opacity=1; m.visible=true; m.userData={life:0}; }

// FOGONAZO de destrucción (bloom) — POOL fijo (NO crear/destruir meshes por muerte → sin picos de GC cuando
// explotan varias a la vez, que era lo que "cortaba la imagen").
const flashPool=[]; for(let i=0;i<28;i++){ const m=new THREE.Mesh(new THREE.CircleGeometry(1,20), new THREE.MeshBasicMaterial({toneMapped:false,transparent:true,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.layers.enable(BLOOM); m.visible=false; m.userData={active:false}; scene.add(m); flashPool.push(m); }
let flashHead=0;
function flashAt(x,y,col,sz,peak){ const m=flashPool[flashHead]; flashHead=(flashHead+1)%flashPool.length;
  m.material.color.set(col||0xffffff); m.position.set(x,y,0.55); m.visible=true;
  m.userData={active:true,life:0,peak:peak||1,r:BALL_R*1.3*(sz||1)}; }

// AURA de PROTECCIÓN del embudo (ESTADO, spec brand-designer 2026-07-18): rim ADITIVO cian↔magenta anclado a la
// bola. Uno por bola, reciclado en buildSim (mismo patrón que ballObjs). NO es elemento de pantalla; parpadea suave
// (~2 Hz) para leerse como "lleva la estrella puesta / está en estado de protección". Paleta cian/magenta (huecos
// sin equipo → no se confunde con color de equipo y aguanta el mood rojo).
function auraMesh(){ const m=new THREE.Mesh(new THREE.RingGeometry(BALL_R*1.30, BALL_R*1.60, 32),
  new THREE.MeshBasicMaterial({color:0x9ff8ff,toneMapped:false,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false}));
  m.renderOrder=7; m.visible=false; return m; }
let auraM=[];

// ICONO DE ESCUDO sobre la bola PROTEGIDA (spec 2026-07-18): heraldo clasico simple, contorno claro, semitransparente
// (~50%) → se sigue viendo la bola por debajo y se lee "protegida por un escudo/habilidad". Textura horneada UNA vez
// y compartida (misma paleta cian/blanco que el aura). Anclado a la bola en UNIDADES DE MUNDO (∝ BALL_R), nunca a
// pantalla. Aparece/desaparece con la MISMA ventana `b.starF` que el aura. NormalBlending (no aditivo) → se lee como
// icono translucido, no como fogonazo.
function shieldTex(){ const S=256; const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d'); const cx=S/2;
  const path=()=>{ x.beginPath();            // silueta de escudo (heraldo): hombros arriba, punta abajo
    x.moveTo(cx, S*0.06); x.lineTo(S*0.86, S*0.19); x.lineTo(S*0.86, S*0.50);
    x.quadraticCurveTo(S*0.86, S*0.82, cx, S*0.96);
    x.quadraticCurveTo(S*0.14, S*0.82, S*0.14, S*0.50);
    x.lineTo(S*0.14, S*0.19); x.closePath(); };
  path(); x.lineWidth=S*0.15; x.strokeStyle='rgba(8,16,34,0.92)'; x.lineJoin='round'; x.stroke();   // BORDE OSCURO (contraste sobre fondos claros/bola de color)
  path(); x.fillStyle='rgba(120,226,255,0.58)'; x.fill();                                           // relleno cian SOLIDO (no tenue)
  x.lineWidth=S*0.062; x.strokeStyle='#f2feff'; x.stroke();                                         // contorno BLANCO grueso (legible pequeno)
  x.lineWidth=S*0.078; x.strokeStyle='#ffffff'; x.lineCap='round'; x.lineJoin='round';              // CHECK central = "protegida/OK"
  x.beginPath(); x.moveTo(S*0.36, S*0.51); x.lineTo(S*0.46, S*0.63); x.lineTo(S*0.66, S*0.37); x.stroke();
  const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; return crispen(t); }
const SHIELD_TEX=shieldTex();
// material PROPIO por escudo (no compartido) → cada uno hace su pop-in/fade independiente. Base 0.85 (se ve la bola
// igual porque el escudo FLOTA sobre el borde superior, no la tapa). Tamano 1.6R = mas pequeno pero nitido.
function shieldMesh(){ const m=new THREE.Mesh(new THREE.PlaneGeometry(BALL_R*2.1, BALL_R*2.1),
  // depthTest:false → dibuja SIEMPRE encima de la bola (la esfera vinyl llega a z~0.92 y tapaba el escudo a 0.62);
  // como es un plano CENTRADO sobre la bola (no un anillo por fuera como el aura), sin esto queda oculto.
  new THREE.MeshBasicMaterial({ map:SHIELD_TEX, transparent:true, opacity:0.6, depthTest:false, depthWrite:false, toneMapped:false }));
  m.renderOrder=9; m.visible=false; m.userData={}; return m; }
let shieldM=[];

//+AG ANILLO "TÚ" (identificación persistente del jugador, port del Cazador): anillo BLANCO sobre tu bola, que se

const youRing = new THREE.Mesh(new THREE.RingGeometry(BALL_R*1.32, BALL_R*1.56, 40),
  new THREE.MeshBasicMaterial({color:0xffffff, toneMapped:false, transparent:true, opacity:0.85, side:THREE.DoubleSide, depthWrite:false, blending:THREE.AdditiveBlending}));
youRing.renderOrder=8; youRing.visible=false; scene.add(youRing);
const youLbl = document.getElementById('youlbl');
const _v3 = new THREE.Vector3();
//+AG estado de la capa de agencia (intro/espectador). running = motor ENCENDIDO (se vuelca a sim.playerRun cada

const DIGITS=3, DIGIT=1.15, GO_HOLD=550;
let phase='intro', introT=0, introRingT=-1; const INTRO_DUR=DIGITS*DIGIT;

//+AG doc 73: `estrenado` = el jugador ya ha encendido el motor alguna vez EN ESTA RONDA. Mientras no lo
