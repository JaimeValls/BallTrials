<script>
/*+AG ?drive=1 (verificacion DOM/JS, docs/34): cuando el pane/iframe NO compone frames, el rAF nativo nunca
   dispara y el juego no avanza. Este script CLASICO (corre ANTES que el modulo) encola los callbacks de rAF
   y falsea performance.now; window.__driveFrames(n) bombea n frames sinteticos a 60fps desde consola/tests.
   Sin ?drive=1 es un no-op total. NO toca la Sim ni el determinismo (solo el reloj del render). */
if(new URLSearchParams(location.search).get('drive')==='1'){
  window.__rafQ=[]; window.__drvT=1000;
  window.requestAnimationFrame=function(cb){ window.__rafQ.push(cb); return window.__rafQ.length; };
  window.cancelAnimationFrame=function(){};
  performance.now=function(){ return window.__drvT; };
  window.__driveFrames=function(n){ for(var i=0;i<n;i++){ window.__drvT+=1000/60; var q=window.__rafQ.splice(0); for(var k=0;k<q.length;k++){ q[k](window.__drvT); } } return window.__drvT; };
}
</script>

<script type="module">

(()=>{ const q=new URLSearchParams(location.search); let cap=2;
  const g=q.get('gfx'); if(g==='low') cap=1; else if(g==='med') cap=1.5;
  if(q.get('redfx')==='1') cap=Math.min(cap,1);

const bloom = createBloom(renderer, scene, cam);

const PU_COL = { turbo:[1,0.55,0.12], giant:[0.7,0.35,1.0], relay:[0.35,1.0,0.45], star:[1.0,0.95,0.55] };

// --- LOOK "ESTUDIO NOCTURNO" (docs/47, tema del dueño en docs/18 §6): A/B por URL. ?look=0 = look viejo. ---

const STAIN_K = VIVID ? 1.5 : 1.0;
const bgEl = document.getElementById('bg');
if(!NEW_LOOK && bgEl) bgEl.style.background='radial-gradient(120% 90% at 50% 30%,#1a1730 0%,#0e0c18 60%,#06050c 100%)';
if(VIVID && bgEl) bgEl.style.background='radial-gradient(120% 90% at 50% 30%,#1d3f6b 0%,#122a52 56%,#0a1330 100%)';

const BACK_W = 16, BACK_H = TOP + 12;   // más ancho que la pista: en 16:9 la columna enseña los flancos
function studioTexture(vivid){
  const W=256, H=2048, c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); const R=new RNG(4242);
  const g=x.createLinearGradient(0,0,0,H);
  if(vivid){ g.addColorStop(0,'#16305a'); g.addColorStop(1,'#2c4f8e'); }                                  // variante MÁS COLOR: azul eléctrico
  else { g.addColorStop(0,'#10141c'); g.addColorStop(1,'#1a2230'); }                                      // default: grafito frío (arriba oscuro → meta más clara)
  x.fillStyle=g; x.fillRect(0,0,W,H);

function buildSim(s){
  sim=new Sim(s, indOpts);   //+AG indOpts=null → torneo (el constructor coacciona a {}); {individual:true,n:8} → individual
  emo=new EmoBook(sim.balls.length, s);
  px=sim.balls.map(b=>b.x); py=sim.balls.map(b=>b.y); prevCam=sim.cam; prevScale=sim.cam_scale;
  lastOv=sim.balls.map(()=>-999);
  //+AG snapshots de aspas/plats para interpolar + reset de estado de agencia por ronda
  prevAspaU=sim.aspas.map(a=>({ux:a.ux,uy:a.uy})); prevPlatX=sim.plats.map(p=>p.x);
  jingled=false; lastBumpF=-9; ended=false; introRingT=-1;
  metaSung=false; metaCartelVivo=false; metaFinPend=null;   //+AG el cartel de meta es por ronda
  quakeUntil=-999; if(bgEl) bgEl.classList.remove('quake');
  if(ballObjs) ballObjs.forEach(o=>scene.remove(o.g));
  // VINILO v2: vRef = VTERM (16 u/s, cap de caida): el estirado llega a tope en caida terminal
  ballObjs=sim.balls.map((b,i)=>attachSquash(makeBallVinyl(scene,b,BALL_R, i===0?ARCH_LOOK_P:null, i===0?ARCH_KEY_P:null), { R:BALL_R, vRef:16, wind, stars }));
  buildMapMeshes();
  document.getElementById('meta').textContent=A().meta(s, TOP|0);   //+AG texto por idioma (AUX)
  document.getElementById('status').textContent='';
  audio.stop(); startAudio();   //+AG ronda nueva: la música arranca YA, con el 3-2-1 (ver startAudio). El stop() es
                                //   lo que la deja empezar de cero al encadenar rondas ("Jugar otra") sin recargar.
}

function react(ev){
  const f=sim.f;
  for(const im of ev.impacts){ const o=ballObjs[im.id]; if(o) o.squash=Math.max(o.squash, 0.22+im.i*0.45);   // SQUASH proporcional al golpe = sensación de PESO al chocar
    // pachinko VIVO: el peg golpeado se enciende un instante del color del equipo (decae en sync). Derivado
    // de la posición determinista de la sim → mismo resultado en preview y captura.
    if(pegFx){ const b=sim.balls[im.id]; let pi=-1, pd=(BALL_R+PEG_R+0.14)*(BALL_R+PEG_R+0.14);
      for(let k=0;k<sim.map.pegs.length;k++){ const p=sim.map.pegs[k], dx=p[0]-b.x, dy=p[1]-b.y, d2=dx*dx+dy*dy; if(d2<pd){ pd=d2; pi=k; } }
      if(pi>=0){ const tc=sat(PAL[b.team].color); pegFx.k[pi]=1; pegFx.col[pi].setRGB(tc[0],tc[1],tc[2]); pegFx.active.add(pi); } } }   //+AG PAL activa (b.team ∈ 0..7 en individual)
  for(const bp of ev.bump){ const o=ballObjs[bp.id]; if(o) o.squash=0.6; P.burst(bp.x,bp.y,0.2,[1,0.8,0.3],8,3.5);
    emo.fire(bp.id,'dolor',PRIO.dolor,9,f); }                                       // golpe de bumper -> dolor
  for(const bo of ev.boost){ const o=ballObjs[bo.id]; if(o){ o.excite=Math.max(o.excite,0.2); P.burst(o.g.position.x,o.g.position.y,0.2,[0.2,0.85,1.0],5,3.0); }
    emo.fire(bo.id,'concentrada',PRIO.concentrada,10,f); }                          // boost -> concentrada (foco, ojos ABIERTOS)
  for(const p of ev.pickup){ const o=ballObjs[p.id]; if(o){o.excite=0.6;o.squash=0.6;} const c=PU_COL[p.type]||[1,1,1]; P.burst(p.x,p.y,0.2,c,18,4.0); itemPops.pop(p.x,p.y,p.type,1.15);
    if(p.type==='giant'||p.type==='star') emo.fire(p.id,'chuleria',PRIO.chuleria,50,f);  // gigante/estrella -> chulería (poderosa)
    else emo.fire(p.id,'sorpresa',4,12,f); }                                        // turbo/relevo -> sorpresa (¡woah!, ojos abiertos)
  for(const r of ev.relay){ if(sim.byTeam) for(const m of sim.byTeam[r.team]) if(m.id!==r.id && m.rank===null) emo.fire(m.id,'sorpresa',4,12,f); }  // compañeras del relevo -> ¡woah!
  for(const fi of ev.finishes){ const tc=sat(PAL[fi.team].color); P.burst(0,GATE_Y,0.2,tc,16,4.0);   //+AG PAL activa · la cara de llegada la pone el AMBIENTE (excitada/celebra), no una feliz-dormida
    // SALPICADURA persistente del color del equipo sobre la zona de meta: el mapa acumula la historia
    // de la carrera (12 llegadas). Escala determinista por id; vive en mapGroup → se limpia al reiniciar.
    if(NEW_LOOK){ const b=sim.balls[fi.id]; addStain(b.x, GATE_Y+0.5, tc, 0.30, 0.75+((fi.id*37)%10)*0.06, -0.26); } }
  if(ev.quake!==null && ev.quake!==undefined){ shake=Math.max(shake,0.35); quakeUntil=f+22;   // ventana "mundo cálido" (raíles+fondo) de la Sacudida
    for(const b of sim.aliveBalls()) emo.fire(b.id,'susto',PRIO.susto,16,f);        // La Sacudida -> susto a todas
    for(let i=0;i<120;i++){const a=Math.random()*6.283,sp=3+Math.random()*7;const c=sat(TEAMS[(Math.random()*4)|0].color);
      P.emit((Math.random()-.5)*WIDTH, sim.cam+(Math.random()-.5)*sim.scale*0.4, 0.2, c[0],c[1],c[2], Math.cos(a)*sp, Math.sin(a)*sp, 0, 0.6+Math.random()*0.5);}
    P.ring(0, sim.cam, [1,0.6,0.3], 0.7);
  }
  //+AG eventos de agencia: nitro (chispas cian, la estela ya sale sola con b.turbo), escudo (onda cian),
  //   super=estrella (burst dorado + chuleria; el parpadeo dorado ya lo pinta sync con b.star)
  for(const e of (ev.nitro||[])){ const o=ballObjs[e.id]; if(o){ o.excite=Math.max(o.excite,0.25); P.burst(o.g.position.x,o.g.position.y,0.2,[0.2,0.85,1.0],10,3.5); } }
  for(const e of (ev.shieldup||[])){ const o=ballObjs[e.id]; if(o) P.ring(o.g.position.x,o.g.position.y,[0.33,0.85,1.0],0.8); }
  for(const e of (ev.super||[])){ const o=ballObjs[e.id]; if(o){ o.squash=0.6; P.burst(o.g.position.x,o.g.position.y,0.2,[1,0.9,0.4],22,5.0); P.ring(o.g.position.x,o.g.position.y,[1,0.85,0.3],0.9); emo.fire(e.id,'chuleria',PRIO.chuleria,50,f); } }
  //+AG doc 55 capa 5: el ACCESORIO reacciona al evento. Solo tu bola (la unica con arch), y solo
  //   se avisa: si el heroe no tiene efecto para ese evento, no pasa nada. Sin arch no hay prop, o
  //   sea que esta linea no existe para el torneo ni para el video.
  for(const t of ['nitro','shieldup','super','dash']){ for(const e of (ev[t]||[])){
    const o=ballObjs[e.id]; if(o&&o.prop&&o.prop.userData.evento) o.prop.userData.evento(t); } }
  //+AG SFX en vivo (patron cazador): mismos canales del video; el jingle de victoria UNA sola vez
  const decidedNow=sim.decision_frame!==null && !jingled; if(decidedNow) jingled=true;
  liveSfx(ev, decidedNow);
}

// === PASO DE SIM (30 Hz determinista) con snapshot para INTERPOLAR el render a 60 fps ===
// La sim NO cambia (mismas seeds/casting/QA/audio); el render muestrea entre el estado previo y el actual.
function stepOnce(){
  for(let i=0;i<sim.balls.length;i++){ const b=sim.balls[i]; px[i]=b.x; py[i]=b.y; }
  prevCam=sim.cam; prevScale=sim.cam_scale;
  //+AG snapshot de aspas (orientacion) y plataformas (x) para interpolar a 60fps (mismo patron px/py)
  for(let i=0;i<sim.aspas.length;i++){ prevAspaU[i].ux=sim.aspas[i].ux; prevAspaU[i].uy=sim.aspas[i].uy; }
  for(let i=0;i<sim.plats.length;i++) prevPlatX[i]=sim.plats[i].x;
  const ev=sim.step(); if(ev) react(ev);
  overtakes();
}
// ADELANTAMIENTOS (pares): i adelanta (y menor = más cerca de meta) -> sorpresa; lo adelantan -> enfado.
// Se evalúa 1 vez POR FRAME DE SIM (aquí, no en sync: sync ahora corre 2x por frame al interpolar).
function overtakes(){
  const f=sim.f; if(f<=30) return;
  for(let i=0;i<sim.balls.length;i++){
    const bi=sim.balls[i]; if(bi.rank!==null || f-lastOv[i]<=22) continue;
    let passed=false, passedBy=false;
    for(let j=0;j<sim.balls.length;j++){ if(i===j) continue; const bj=sim.balls[j]; if(bj.rank!==null) continue;
      if(py[i]>py[j] && bi.y<bj.y) passed=true;
      if(py[i]<py[j] && bi.y>bj.y) passedBy=true; }
    if(passed){ emo.fire(i,'sorpresa',4,14,f); lastOv[i]=f; }
    else if(passedBy){ emo.fire(i,'enfado',4,8,f); lastOv[i]=f; }
  }
}
// sync(dt, a): a = fracción [0..1] entre el frame previo y el actual de la sim. fF = frame FRACCIONAL
// (reloj determinista por frame, NO performance.now → en captura = tembleque de la copa).
function sync(dt, a=1){
  const celebrating = sim.winner_team!==null && sim.decision_frame!==null;
  const f=sim.f, fF=Math.max(0,sim.f-1+a), simNowF=fF*(1000/FPS);
  const camY=prevCam+(sim.cam-prevCam)*a, camS=prevScale+(sim.cam_scale-prevScale)*a;
  for(let i=0;i<sim.map.powerups.length;i++){ if(puMeshes[i]) puMeshes[i].visible=!sim.map.powerups[i].taken; }
  // BARRERAS: pieza dañada PARPADEA cada vez más rápido y vira a naranja/rojo (telegrafía la rotura);
  // al romperse, se oculta y lanza astillas calientes + de acero + chispas del color de quien la rompe.
  for(const gm of gateMeshes){ const g=gm.g;
    for(let ti=0;ti<g.tiles.length;ti++){ const t=g.tiles[ti], m=gm.tiles[ti], mat=m.material;
      if(!t.alive){
        if(!gm.broke[ti]){ gm.broke[ti]=true; m.visible=false; m.scale.set(1,1,1);
          P.burst(t.cx, g.y, 0.3, [0.95,0.55,0.16], 18, 5.8);               // astillas CALIENTES (naranja)
          P.burst(t.cx, g.y, 0.3, [0.82,0.86,0.94], 12, 4.4);               // astillas de acero
          P.burst(t.cx, g.y, 0.3, sat(t.pc||[0.7,0.75,0.82]), 8, 4.0);      // chispas del color de quien rompe
          P.ring(t.cx, g.y, [1,0.5,0.15], 0.5); shake=Math.max(shake, 0.15);
          // CICATRIZ persistente (P2 drama-pinta-mapa): quemadura oscura + tinte de quien rompió.
          // Sutil (restraint): mancha, no pegatina. Se limpia sola al reiniciar (vive en mapGroup).
          if(NEW_LOOK){ addStain(t.cx, g.y, [0.03,0.035,0.06], 0.34, 1.05, -0.28);
            addStain(t.cx, g.y, sat(t.pc||[0.7,0.75,0.82]), 0.20, 0.62, -0.27); }
        }
        continue;
      }
      if(gm.broke[ti]){ gm.broke[ti]=false; m.visible=true; }                // reinicio de semilla
      const dmg=Math.max(0, Math.min(1, 1 - t.hp/gm.hp0[ti]));               // 0 intacta → 1 a punto de romper
      if(dmg<0.02){ mat.color.setHex(0x9aa6b8); mat.emissive.setHex(0x2a3442); mat.emissiveIntensity=0.7; m.scale.set(1,1,1); continue; }
      const blink=0.5+0.5*Math.sin(fF*(0.18+dmg*1.05));                      // parpadea MÁS RÁPIDO cuanto más dañada (fF = suave a 60 fps)
      mat.color.setRGB(0.60+0.40*dmg, 0.66-0.42*dmg, 0.72-0.60*dmg);         // acero → naranja
      mat.emissive.setRGB(0.16+1.0*dmg*blink, 0.20+0.40*dmg*blink, Math.max(0,0.26-0.16*dmg)*1.0);
      mat.emissiveIntensity=0.7+dmg*(1.0+2.0*blink);                          // brillo pulsa y sube con el daño
      m.scale.set(1+dmg*0.10*(blink-0.5), 1+dmg*0.16*(blink-0.5), 1);         // micro-vibración (estrés)
    }
  }
  // --- LOOK ESTADIO: decaimiento del flash de pegs, raíles reactivos, motas a la deriva, fondo de Sacudida ---
  if(NEW_LOOK){
    if(pegFx && pegFx.active.size){ const tmp=RAIL_TMP;
      for(const pi of [...pegFx.active]){ const k=(pegFx.k[pi]-=dt*2.4);
        if(k<=0){ pegFx.k[pi]=0; pegFx.mesh.setColorAt(pi,pegFx.base[pi]); pegFx.active.delete(pi); }
        else { tmp.copy(pegFx.base[pi]).lerp(pegFx.col[pi], Math.min(1,k)*0.9); pegFx.mesh.setColorAt(pi,tmp); } }
      if(pegFx.mesh.instanceColor) pegFx.mesh.instanceColor.needsUpdate=true; }
    // raíles: base fría → naranja PELIGRO en la Sacudida → color del ganador en la celebración
    let railT=RAIL_BASE;
    if(celebrating && sim.winner_team!==null){ const wc=sat(PAL[sim.winner_team].color); railT=RAIL_WIN.setRGB(wc[0],wc[1],wc[2]); }   //+AG PAL activa (torneo o individual)
    else if(f<quakeUntil) railT=RAIL_HOT;
    const kr=1-Math.pow(0.86, dt*FPS);
    for(const r of rails) r.material.color.lerp(railT, kr);
    if(bgEl) bgEl.classList.toggle('quake', f<quakeUntil && !celebrating);
    // motas: deriva lenta determinista por reloj de sim (mismo patrón que el cazador)
    if(dust){ for(let i=0;i<dust.base.length;i++){ const d=dust.base[i];
      dust.pos[i*3]=d.x+Math.sin(simNowF*0.001*d.sp+d.ph)*d.amp; dust.pos[i*3+1]=d.y+Math.cos(simNowF*0.0012*d.sp+d.ph)*d.amp; }
      dust.geo.attributes.position.needsUpdate=true; }
  }
  //+AG aspas: la PALA gira interpolada (lerpU + atan2, patron molinillo de gauntlet); el disco-guia queda fijo.
  for(let i=0;i<aspaMs.length;i++){ const [ux,uy]=lerpU(prevAspaU[i], sim.aspas[i].ux, sim.aspas[i].uy, a);
    aspaMs[i].userData.blade.rotation.z=Math.atan2(uy,ux); }
  //+AG plataformas: posicion x interpolada + chevrones espejados con el sentido del vaiven
  for(let i=0;i<platMs.length;i++){ const p=sim.plats[i];
    platMs[i].position.x=prevPlatX[i]+(p.x-prevPlatX[i])*a;
    platMs[i].userData.chev.scale.x=p.vx>=0?1:-1; }
  //+AG anillo TU sobre la bola del jugador (posicion interpolada; cian mientras dura el escudo), patron cazador
  { const plb=sim.balls[0];
    if(plb.rank===null && !celebrating){
      const pbx=px[0]+(plb.x-px[0])*a, pby=py[0]+(plb.y-py[0])*a, shieldOn=plb.shield>0;
      youRing.visible=true; youRing.position.set(pbx,pby,0.55+BALL_R+0.30);
      youRing.material.color.set(shieldOn?0x54d8ff:0xffffff);
      youRing.material.opacity=shieldOn?0.95:(0.62+0.18*Math.abs(Math.sin(simNowF*0.012)));
      _v3.set(pbx, pby+BALL_R*2.0, 0.55+BALL_R).project(cam);
      youLbl.style.left=(colLeft+( _v3.x*0.5+0.5)*colW).toFixed(0)+'px';
      youLbl.style.top=((-_v3.y*0.5+0.5)*colH).toFixed(0)+'px';
      youLbl.style.opacity='1';
    } else { youRing.visible=false; youLbl.style.opacity='0'; } }
  for(let i=0;i<sim.balls.length;i++){
    const b=sim.balls[i], o=ballObjs[i];
    o.excite=Math.max(0,o.excite-dt);   // el squash (o.squash) lo consume ahora attachSquash (VINILO v2)
    const sc=b.scale*b.sqz;   //+AG el "give" del un-rest (b.sqz) es VISIBLE a propósito (como en carrera.html): el radio de colisión y el visual coinciden → cero clipping bola-peg
    // CELEBRACIÓN PROGRESIVA (como Blender): la bola que llega SALTA; salta MÁS cuantas más compañeras
    // hayan llegado (1=relajada amp 0.12, 2=saltan 0.55, VICTORIA=salto grande 1.4); perdedores encogen.
    let jumpY=0, scl=1;
    if(b.rank!==null){
      if(o.finishF===undefined) o.finishF=f;
      let amp;
      if(celebrating){ if(b.team===sim.winner_team) amp=1.4; else { amp=0; scl=0.82; } }
      else { const nArr=sim.byTeam[b.team].filter(x=>x.rank!==null).length; amp = nArr>=2 ? 0.55 : 0.12; }
      jumpY = Math.abs(Math.sin((fF-o.finishF)*0.18))*amp;
    }
    const bx=px[i]+(b.x-px[i])*a, by=py[i]+(b.y-py[i])*a;   // posición INTERPOLADA entre frame previo y actual (60 fps)
    o.g.position.set(bx,by+jumpY,0.5+BALL_R*(sc-1));
    o.g.scale.setScalar(sc*scl);
    o.sqUpdate(bx, by+jumpY, dt);   // VINILO v2: squash direccional + tilt + cara viva + viento + estrellas
    // estrella: parpadeo emisivo
    if(b.star>0){ const fl=0.5+0.5*Math.sin(fF*0.8); o.mat.emissive.setRGB(0.5+fl*0.5,0.5+fl*0.45,fl*0.3); o.mat.emissiveIntensity=0.9; }
    else { o.mat.emissive.setRGB(o.col[0],o.col[1],o.col[2]); o.mat.emissiveIntensity=0.40; }  // = gominola del chasis (no pisar el material)
    // estela de VELOCIDAD compartida (turbo/relevo/boost). La ESTRELLA no la lleva (es invencibilidad → ya parpadea arriba).
    if(b.turbo>0||b.in_boost) P.trail(bx,by,b.vx,b.vy);
    // EMOCIONES (ojos ABIERTOS, NUNCA dormida): en carrera = concentrada/alerta; al llegar = excitada/celebra
    if(b.rank!==null){                                   // ya en meta
      const nArr=sim.byTeam[b.team].filter(x=>x.rank!==null).length;
      if(celebrating && b.team===sim.winner_team) emo.ambient(i,'extasis',PRIO.extasis);   // GANA: estrellas
      else if(celebrating) emo.ambient(i,'triste',4);                                      // perdedor: triste (no dormido)
      else emo.ambient(i, nArr>=2?'extasis':'neutral', nArr>=2?PRIO.extasis:0);            // 1=relajada alerta · 2+=¡excitada! (estrellas)
    }
    else { //+AG mirada por zona del JUGADOR (legibilidad del control, docs/28 §4): concentrada con gaze hacia su zona
      const conc=(i===0&&b.dir===DIR.LEFT)?'conc_cL':(i===0&&b.dir===DIR.RIGHT)?'conc_c':'concentrada';
    if(b.y < GATE_Y+6.0) emo.ambient(i,conc,PRIO.concentrada);   // sprint final
    else if((py[i]-b.y) > 0.30) emo.ambient(i,conc,PRIO.concentrada);  // bajando en carrera -> FOCO
    else emo.ambient(i,'neutral',0); }                                         // lenta/parada -> neutral alerta (parpadeo natural ok)
    o.setExpr(archFace(i===0?ARCH_KEY_P:null, emo.resolve(i,f)));   //+AG en reposo, TU bola pone la cara de su ficha
  }
  // celebración: confeti cayendo sobre la meta (la cámara de la sim ya hace zoom a la meta)
  if(celebrating){
    trophy.visible=true;
    if(sim.winner_team!=null){ const wc=PAL[sim.winner_team].color; trophy.material.color.setRGB(wc[0],wc[1],wc[2]); }   // copa del color del ganador (PAL activa)
    const ts=Math.min(1,(fF-sim.decision_frame)/10);   // pop al decidirse
    trophy.scale.setScalar(Math.max(0,ts)*(1+0.05*Math.sin(simNowF*0.005)));
    trophy.position.set(0, camY+camS*0.28, 2);
    // CONFETI GRANDE que CAE hasta la zona de las bolas (pool de 56, no lluvia de puntitos)
    const top=camY+camS*0.55, bot=camY-camS*0.55, t=simNowF*0.001;
    for(const m of confetti){ const u=m.userData;
      if(!confettiInit){ m.position.set((Math.random()-0.5)*WIDTH*1.1, bot+Math.random()*(top-bot), 1.5); m.visible=true; }
      m.position.y += u.vy*dt;
      m.position.x += Math.sin(t*u.swF+u.ph)*u.swA*dt*3;
      m.rotation.set(u.sx*t, u.sy*t, u.ph+t*2);          // flutter (gira en 3 ejes, DoubleSide)
      if(m.position.y < bot){ m.position.y = top; m.position.x=(Math.random()-0.5)*WIDTH*1.1; }
    }
    confettiInit=true;
  } else { trophy.visible=false; if(confettiInit){ for(const m of confetti) m.visible=false; confettiInit=false; } }
}

// === PANELES LATERALES (broadcast 16:9): la carrera se renderiza en una COLUMNA CENTRAL y las bandas
// llevan el marcador. Así la pista se ve grande (como el vertical) sin vacío. La cámara usa el ASPECTO
// de la columna (no de la ventana) → no puedo usar frameOrtho del chasis (lee innerWidth/innerHeight).
const panL=document.getElementById('panL'), panR=document.getElementById('panR');
const COL_FRAC=0.50; let colW=innerWidth, colH=innerHeight, colLeft=0;   // 0.46→0.50 (2026-06-29): columna de pista más ancha
function layout(){
  const land=innerWidth>innerHeight;                 // 16:9 torneo = columna+paneles; 9:16 short = pista a pantalla completa
  if(land){ colW=Math.round(innerWidth*COL_FRAC); colH=innerHeight; colLeft=Math.round((innerWidth-colW)/2);
    panL.style.display=panR.style.display=''; }
  else { colW=innerWidth; colH=innerHeight; colLeft=0; panL.style.display=panR.style.display='none'; }
  renderer.setSize(colW,colH); bloom.setSize(colW,colH);
  const cv=renderer.domElement; cv.style.left=colLeft+'px'; cv.style.top='0px';
  panL.style.width=colLeft+'px'; panR.style.width=(innerWidth-colLeft-colW)+'px';
}
let teamPips=[], teamCards=[], miniDots=[];
function buildPanels(){
  panL.innerHTML=''; panR.innerHTML=''; teamPips=[]; teamCards=[]; miniDots=[];
  //+AG parametrizado por NT/BPT/NB/PAL: torneo = 4 tarjetas×3 pips + 12 dots; individual = 8 tarjetas×1 pip + 8 dots.

function updatePanels(){
  // IZDA: pips por equipo (llenos = bolas en meta) + resalte del LÍDER (más metidas; desempate por mejor posición)
  let leadT=0, leadDone=-1, leadBest=1e9;
  for(let t=0;t<NT;t++){ const done=sim.team_done[t];
    for(let k=0;k<BPT;k++){ const p=teamPips[t][k];
      if(k<done){ p.style.background=p.dataset.hex; p.style.borderColor=p.dataset.hex; }
      else { p.style.background='transparent'; p.style.borderColor='rgba(255,255,255,.30)'; } }
    let best=1e9; for(const b of sim.byTeam[t]) best=Math.min(best, b.rank!==null ? -1000+b.rank : b.y);   // rank manda; si corre, menor y = mejor
    if(done>leadDone || (done===leadDone && best<leadBest)){ leadDone=done; leadBest=best; leadT=t; }
  }
  if(sim.winner_team!==null && sim.decision_frame!==null) leadT=sim.winner_team;   // celebración: el resalte se fija al GANADOR (no al líder por posición)
  for(let t=0;t<NT;t++) teamCards[t].classList.toggle('lead', t===leadT && sim.f>1);
  // DCHA: minimapa de profundidad (arriba=salida, abajo=meta); los que llegan, abajo con aro dorado
  const span=TOP-GATE_Y;
  for(let i=0;i<NB;i++){ const b=sim.balls[i], d=miniDots[i];
    let frac; if(b.rank!==null){ frac=1; d.classList.add('fin'); } else { frac=1-(b.y-GATE_Y)/span; d.classList.remove('fin'); }
    d.style.top=(Math.max(0,Math.min(1,frac))*100)+'%';
  }
}
function frameCamera(dt, a=1){ shake=Math.max(0,shake-dt*1.5);
  const cy=prevCam+(sim.cam-prevCam)*a, cs=prevScale+(sim.cam_scale-prevScale)*a;   // cámara INTERPOLADA (60 fps)
  const aspect=colW/colH, half=cs/2;                   // fit por ALTO (descenso), con el aspecto de la COLUMNA
  cam.left=-half*aspect; cam.right=half*aspect; cam.top=half; cam.bottom=-half; cam.updateProjectionMatrix();
  cam.position.set((Math.random()-.5)*shake, cy+(Math.random()-.5)*shake, 60); cam.lookAt(0,cy,0);
}

// PREVIEW: la sim avanza a 30 Hz con acumulador y el render INTERPOLA con alpha=acc/STEP →
// fluido a la tasa del monitor (60/120/144 Hz), sin tocar el determinismo de la sim.
const clock=new THREE.Clock(); let acc=0;
//+AG INTRO (patron cazador): cuenta atras 3-2-1-YA con la SIM EN PAUSA. La camara hace zoom-out desde TU bola
//   (arriba, en la parrilla) hasta el encuadre de carrera + ondas sobre ti = "este eres tu" (docs/20 T1.7).
function introCamera(t){
  const p=sim.balls[0];
  const k=Math.min(1, t/(INTRO_DUR*0.72)), e=1-Math.pow(1-k,3);   // easeOutCubic
  const scale=5.0+(CAM_SCALE-5.0)*e, half=scale/2, aspect=colW/colH;
  const cy=p.y+((TOP-CAM_SCALE/2)-p.y)*e, cx=p.x*(1-e);
  cam.left=-half*aspect; cam.right=half*aspect; cam.top=half; cam.bottom=-half; cam.updateProjectionMatrix();
  cam.position.set(cx,cy,60); cam.lookAt(cx,cy,0);
}
function introUI(t){

  if(t<DIGITS*DIGIT){ const cur=DIGITS-Math.floor(t/DIGIT), frac=(t%DIGIT)/DIGIT;
    n.textContent=String(cur); n.style.color='#fff';

function goFlash(){ const n=document.getElementById('countN');
  n.textContent=T().go; n.style.color='#7cff9a'; n.style.transform='scale(1)'; n.style.opacity='1';
  clearTimeout(goT); goT=setTimeout(()=>document.getElementById('count').classList.remove('show'), GO_HOLD); }
let goT=0;
function loop(){
  const dt=Math.min(clock.getDelta(),0.05);
  //+AG fases de agencia: menu (overlay encima, escena viva detras) e intro (cuenta atras, sim EN PAUSA)
  if(phase!=='play'){
    sync(dt,1); P.update(dt); itemPops.update(dt); stars.update(dt); wind.update(dt); updatePanels();
    if(phase==='intro'){ introT+=dt; introCamera(introT); introUI(introT); }
    else frameCamera(dt,1);
    bloom.renderScene(); updateHUD();
    if(phase==='intro' && introT>=INTRO_DUR){ phase='play'; acc=0; clock.getDelta(); goFlash(); startAudio(); }
    requestAnimationFrame(loop); return;
  }
  acc+=dt; const STEP=1/FPS; let steps=0;
  if(coachPaused) acc=0;   //+AG tutorial v2: mundo congelado; el acumulador se vacía para no soltar una ráfaga al reanudar
  while(acc>=STEP && !sim.done && steps<4){ stepOnce(); acc-=STEP; steps++; }
  if(sim.done) acc=0;
  const a=(sim.done||NO_INTERP)?1:Math.min(1,acc/STEP);
  sync(dt,a); P.update(dt); itemPops.update(dt); stars.update(dt); wind.update(dt); updatePanels(); frameCamera(dt,a); bloom.renderScene();
  updateHUD();   //+AG
  cantarEnMeta();   //+AG tu puesto se canta EN EL CRUCE, no al resolverse la carrera entera (ver la funcion)
  if(sim.done && !ended){ ended=true; setTimeout(showEnd, 900); }   //+AG cartel de fin (la celebracion ya corrio dentro de la sim)
  requestAnimationFrame(loop);
}
// CAPTURA a 60 fps REALES: por cada paso de sim (30 Hz) se sirven 2 frames interpolados (alpha 0.5 y 1.0).
// La sim es EXACTAMENTE la misma (seeds/casting/QA/audio intactos); solo el muestreo visual se duplica.
// info().fps=60 → capture.mjs codifica el MP4 a 60 y escala su presupuesto de frames.
const CAP_FPS=60, CAP_SUB=CAP_FPS/FPS; let capK=0;
window.__cap = {
  step(){
    if(!sim.done && capK%CAP_SUB===0) stepOnce();
    capK++;
    const a=(sim.done||NO_INTERP)?1:(capK%CAP_SUB===0?1:(capK%CAP_SUB)/CAP_SUB);
    const dt=1/CAP_FPS;
    sync(dt,a); P.update(dt); itemPops.update(dt); stars.update(dt); wind.update(dt); updatePanels(); frameCamera(dt,a); bloom.renderScene();
    return sim.done && capK%CAP_SUB===0;
  },
  done(){ return sim.done; }, info(){ return { fps:CAP_FPS, frame:sim.f, cap:capK, done:sim.done, seed:sim.seed, winner:sim.winner_team }; },
};

const AUDIO_SR=44100;

//   (MODE_TRACK del vídeo); race2/race3 son BallMania Race 02 y 03, que estaban sin usar. Mismo estilo y mismo
//   tempo: la carrera suena igual de carrera con cualquiera de las tres, solo deja de ser SIEMPRE la misma.
//+AG VB Jaime 2026-07-27: VOLUMEN DE MUSICA del jugador. El shell manda &mvol=0..1 (Ajustes; defecto 0.20 = muy
//   baja, para que no moleste) y multiplica el nivel calibrado del modo. FUERA del shell (standalone/captura de

const MVOL=(()=>{ const v=parseFloat(params.get('mvol')); return (isFinite(v)&&v>=0&&v<=1)?v:(EMBED?0.65:1); })();   //+AG el 0.65 es el respaldo si el shell no manda &mvol; el defecto de verdad vive en MUSIC_VOL_DEF de juego.html

//   shell via &music=/&sfx= (defecto ON: sin parametro = suena, defecto de JUEGO no de video). En standalone

let musicOn=false, sfxOn=false;

//+AG SFX EN VIVO (patron cazador): con un JUGADOR el futuro no se puede precalcular (el runToEnd del video queda

//+AG ESTADO VIVO DEL AUDIO DE PARTIDA, para comprobarlo sin oidos (misma idea que BT_MUSIC.estado del shell, y por

//   puede mentir. Si sale ctx 'suspended' con sonando=true, la partida esta muda aunque el juego diga que no.

window.BT_MATCH_AUDIO = { get estado(){ return { phase, musicOn, sfxOn, unlocked:audio.unlocked,
  sonando:audio.musicPlaying, hasMusic:audio.hasMusic, ctx:(audio.ctx?audio.ctx.state:'sin-ctx'), nivel:audio.musicLevel }; } };
let liveGain=null;
function liveSfx(ev, won){
  if(!sfxOn || !audio.unlocked || !audio.ctx) return;
  const reb={}; let any=false;
  const put=(k,arr)=>{ if(arr&&arr.length){ reb[k]=[...(reb[k]||[]), ...arr.map(e=>({...e,f:0}))]; any=true; } };
  //+AG mapeos a los canales del video: bump con throttle (el thin de sfxmap solo des-densifica DENTRO de una
  //   llamada), nitro del JUGADOR -> pickup turbo (bling+zip, hermano sonoro de la estela), escudo -> bling
  //   generico, super -> pickup star, quake -> twists, ding de meta por rank (ver sfxmap //+AG).
  if(ev.bump && ev.bump.length && sim.f-lastBumpF>=4){ put('bump',[ev.bump[0]]); lastBumpF=sim.f; }
  put('pickup', ev.pickup);
  put('pickup', (ev.nitro||[]).filter(e=>e.id===0).map(e=>({type:'turbo'})));
  put('pickup', (ev.shieldup||[]).filter(e=>e.id===0).map(e=>({type:'shield'})));
  put('pickup', (ev.super||[]).map(e=>({type:'star'})));
  put('relay', ev.relay); put('gatebreak', ev.gatebreak); put('finishes', ev.finishes);
  if(ev.quake!==null && ev.quake!==undefined){ reb.twists=[{f:0}]; any=true; }
  if(!any && !won) return;
  const buf=buildSfxBuffer({ events:reb, decision_frame: won?0:null, f:FPS*4, seed:(seed*7919+sim.f)>>>0, SR:AUDIO_SR });
  if(!liveGain){ liveGain=audio.ctx.createGain(); liveGain.gain.value=0.92; liveGain.connect(audio.ctx.destination); }
  const ab=audio.ctx.createBuffer(1, buf.length, AUDIO_SR); ab.getChannelData(0).set(buf);
  const src=audio.ctx.createBufferSource(); src.buffer=ab; src.connect(liveGain); src.start();
}

//+AG clasificación de EQUIPOS al terminar: done (nº de bolas en meta) manda; empate → el que completó antes; luego progreso.
function teamStandings(){
  const arr=[];
  for(let t=0;t<4;t++){ const ms=sim.byTeam[t], fin=ms.filter(b=>b.rank!==null), un=ms.filter(b=>b.rank===null);
    arr.push({ t, done:fin.length, lastFin:fin.length?Math.max(...fin.map(b=>b.finF)):Infinity, bestY:un.length?Math.min(...un.map(b=>b.y)):-Infinity }); }
  arr.sort((a,b)=> b.done-a.done || a.lastFin-b.lastFin || a.bestY-b.bestY);
  return arr;
}
//+AG CLASIFICACION REAL de la carrera para el shell (bug: la tabla de Resultados se inventaba los puestos con bots
//   al azar y no coincidia con quien ganaba en pista). MISMO criterio que sim.playerPlace(): las que han cruzado van
//   por orden de cruce (rank) y las que no, por Y (menor = mas adelantada). Solo lee la sim, no la toca.
//+AG OJO: al acabar, la sim le pone al JUGADOR un rank SINTETICO (ahead+1, contando tambien bolas que no han
//   cruzado), que NO esta en la escala de los ranks de cruce (1..sim.placed). Ordenar por rank a secas le daba un
//   puesto mejor del emitido (p.ej. seed 98 torneo: tabla 10o vs playerPlace 11o). Solo cuentan como CRUZADAS las
//   de rank<=sim.placed; el resto (incluido ese jugador) van por Y, exactamente como hace sim.playerPlace().
function ballOrder(){
  const crossed=b=> b.rank!==null && b.rank<=sim.placed;
  const key=b=> crossed(b) ? [0,b.rank] : [1,b.y];
  return [...sim.balls].sort((a,b)=>{ const A=key(a), B=key(b); return A[0]-B[0] || A[1]-B[1]; });
}
//+AG payload de clasificacion: una fila por BOLA con su color REAL de la paleta activa (8 sueltos o 4 equipos).
function standingsPayload(){
  return ballOrder().map((b,i)=>({ place:i+1, ballId:b.id, teamIdx:b.team, isPlayer:b===sim.player,
    color:[b.color[0],b.color[1],b.color[2]] }));
}
//+AG payload de clasificacion por EQUIPOS (solo torneo 4x3): el puesto que puntua en el shell.
function teamStandingsPayload(){
  return teamStandings().map((s,i)=>({ place:i+1, teamIdx:s.t, isPlayerTeam:s.t===sim.player.team,
    color:[...sim.teams[s.t].color] }));
}

  if(ovState==='intro'){ el('ovTitle').textContent=t.name; el('ovSub').innerHTML=t.sub; el('ovBtn').textContent=t.play; }
  else if(INDIVIDUAL){   //+AG cartel de fin INDIVIDUAL: puesto propio (1..8), sin lenguaje de equipo
    const won=lastPlace===1, medal={1:' 🏆',2:' 🥈',3:' 🥉'}[lastPlace]||'';
    el('ovTitle').innerHTML = t.fin(ord(lastPlace,LANG))+medal;
    el('ovSub').innerHTML = won ? t.podium : t.retry;
    el('ovBtn').textContent=t.again; }
  else { const tt=TT(), dot=TEAMDOT[myTeam], won=(winnerTeam===myTeam), medal={1:' 🏆',2:' 🥈',3:' 🥉'}[teamPlace]||'';
    el('ovTitle').innerHTML = won ? `${dot} ${tt.tw} 🏆` : `${dot} ${tt.tp(ord(teamPlace,LANG))}${medal}`;
    const winLine = won ? t.podium : tt.tW(TEAMDOT[winnerTeam]);
    el('ovSub').innerHTML = `${winLine}<br><small style="opacity:.72">${tt.xd(ord(lastPlace,LANG))}</small>`;
    el('ovBtn').textContent=t.again; }
}
//+AG doc 49: 18 de los 20 idiomas se DESCARGAN, asi que cambiar de idioma tiene dos tiempos: se pinta ya con
//   lo que haya (ingles) y se repinta cuando aterriza el paquete. El fundido es SIEMPRE sobre el ingles, no
//   sobre el idioma anterior: si no, saltar de aleman a turco heredaba las claves alemanas que al turco le
//   faltasen y salia una pista en dos idiomas.
let PACK=null;
const TRAS_PACK=[];
function alLlegarPack(f){ TRAS_PACK.push(f); if(PACK){ try{ f(PACK,LANG); }catch(e){} } }
function applyLang(l){
  LANG=BTI18N.LANGS[l]?l:'en'; PACK=null;
  //   la PISTA no se espeja aunque el idioma sea arabe (noRtl): ◀/▶ apuntan a lo que pasa en pantalla.
  BTI18N.applyDoc(LANG,{noRtl:true});
  pintaLang();
  BTI18N.load(LANG).then(p=>{ if(!p || LANG!==l) return;
    PACK=p;
    if(p.race)     I18N[LANG]    =Object.assign({},I18N.en,p.race);
    if(p.raceAux)  AUX[LANG]     =Object.assign({},AUX.en,p.raceAux);
    if(p.raceTeam) TEAMI18N[LANG]=Object.assign({},TEAMI18N.en,p.raceTeam);
    TRAS_PACK.forEach(f=>{ try{ f(p,LANG); }catch(e){} });
    pintaLang(); });
}
function pintaLang(){ const t=T(); el('lang').value=LANG;
  el('hint').innerHTML=t.hint; el('lblAtt').textContent=t.atts; el('lblBoost').textContent=t.boosts;

  el('bNit').querySelector('.t').textContent=t.nitro; el('bShd').querySelector('.t').textContent=t.shield; el('bSup').querySelector('.t').textContent=t.super;
  el('superlbl').textContent=t.superLbl; youLbl.textContent=t.you; el('countYou').textContent=t.youIntro;
  //+AG capa +AG: titulo de pestaña, esquinas y error tambien por idioma (antes eran fijos en espanol)
  const a=A(); el('backMenu').textContent=a.menu; el('ovMenu').textContent=a.menu;   //+AG menu localizado (esquina + cartel de fin)
  document.title=`YouBall · ${t.name} (WebGL)`;
  el('hudName').textContent=a.hud(t.name); el('keys').innerHTML=a.keys; el('err').textContent=a.err;
  const sb=el('snd'); if(sb) sb.title=a.sound;
  if(sim) el('meta').textContent=a.meta(seed, TOP|0);
  if(arranque) arranque.refresh(); if(banner) banner.refresh();   //+AG el cartel de arranque y la banda del modo también viven en el idioma del shell

(function(){ const sel=el('lang'); for(const k in LANGS){ const o=document.createElement('option'); o.value=k; o.textContent=LANGS[k].name; sel.appendChild(o); }

  el('cdShd').textContent=p.shieldCd>0?Math.ceil(p.shieldCd/FPS)+'s':t.ready;
  el('cdSup').textContent=ready?(LANG==='es'?'¡'+t.superLbl+'!':t.superLbl+'!'):Math.round(sim.super*100)+'%';   //+AG solo el espanol lleva el ¡ de apertura
  for(const k in dirBtns) dirBtns[k].classList.toggle('on',+k===p.dir);
}
//+AG la FASE se pone ANTES de buildSim, no después: buildSim llama a startAudio() y con la fase vieja ('play', al
//   pulsar "Jugar otra") soltaba la música encima de la cuenta atrás en vez de en el "¡YA!".
function startRound(){ phase='intro'; introT=0; introRingT=-1; clearTimeout(goT);
  seed=newSeed(); buildSim(seed); el('ov').classList.add('hide'); el('count').classList.add('show');
  //+AG los beeps se programan DE UNA VEZ con la misma cuenta que pintan los números (DIGITS/DIGIT), así caen
  //   clavados aunque un frame se retrase. Si el audio no está desbloqueado (nadie tocó "¡LISTO!") no suena nada.
  if(sfxOn && audio.unlocked) sfxCountdown(audio, { digits:DIGITS, digitDur:DIGIT, goAt:INTRO_DUR }); }
//+AG tu puesto de CRUCE es definitivo (nadie por detras te lo puede quitar), asi que se canta en el frame en
//   que la sim te lo pone. Solo cruce REAL (rank<=sim.placed): el rank SINTETICO que la sim asigna al acabar a
//   quien no cruzo no es un cruce — ese lo canta showEnd() como siempre. Solo INDIVIDUAL: en POR EQUIPOS lo que
//   se canta es el puesto del EQUIPO, que no se sabe hasta que el equipo completa (sigue en showEnd).
function cantarEnMeta(){
  if(metaSung || !EMBED || TUTORIAL || !INDIVIDUAL || !sim) return;
  const r=sim.player.rank;
  if(r===null || r>sim.placed) return;
  metaSung=true; metaCartelVivo=true;
  cantarPuesto({ place:r, total:sim.balls.length, lang:LANG }, ()=>{
    metaCartelVivo=false;
    if(metaFinPend){ const f=metaFinPend; metaFinPend=null; f(); }
  });
}
function showEnd(){
  if(TUTORIAL) return;   //+AG tutorial: ni matchEnd ni cartel de fin; el COACH cierra con bt:tutorialEnd
  lastPlace=sim.player.rank||sim.playerPlace();
  myTeam=sim.player.team; winnerTeam=sim.winner_team!==null?sim.winner_team:myTeam;
  if(EMBED){   //+AG el shell manda el DESPUÉS (Resultados), pero el puesto se canta AQUÍ, en meta (ver veredicto.mjs)
    let tPlace;
    if(!INDIVIDUAL){ const st=teamStandings(); tPlace=st.findIndex(s=>s.t===myTeam)+1;   // POR EQUIPOS: puesto real del equipo (1..4)
      winnerTeam=sim.winner_team!==null?sim.winner_team:st[0].t; }
    else tPlace=(sim.player.team===winnerTeam)?1:0;
    //+AG el shell pinta la tabla con ESTAS bolas (no se inventa nada) y el disco de campeon con winnerColor.
    //+AG winnerColor = color del equipo/bola que el MOTOR ha coronado (winnerTeam), que es lo que el jugador ha
    //   visto celebrar en pista. El shell corona esa misma fila de la tabla → disco, nombre y corona siempre casan.
    const st=standingsPayload(), tst=INDIVIDUAL?null:teamStandingsPayload();
    const winnerColor = sim.teams[winnerTeam] ? [...sim.teams[winnerTeam].color] : (st[0]?st[0].color:null);
    //+AG el cartel de META va PRIMERO y el resultado se suelta DESPUÉS: mientras el cartel esté en pantalla
    //   el shell no puede cerrar el iframe, que era justo el "flash" que se queria evitar no pintando nada.
    //   En POR EQUIPOS lo que cuenta es el puesto del EQUIPO, que es el que el jugador ha visto coronar.
    const _fin=()=>{ try{ parent.postMessage({type:'bt:matchEnd', mode:'race', seed, playerPlace:lastPlace, teamPlace:tPlace, winnerTeam, winnerColor, standings:st, teamStandings:tst, durationF:sim.f}, '*'); }catch(e){} };
    //+AG si el cartel ya se canto EN EL CRUCE (cantarEnMeta) no se repite: se suelta el resultado ya,
    //   o se aplaza a que ese cartel cierre si aun esta en pantalla (la regla cartel→resultado se mantiene).
    if(metaSung){ if(metaCartelVivo) metaFinPend=_fin; else _fin(); }
    else cantarPuesto({ place: INDIVIDUAL?lastPlace:tPlace, total: st.length, lang:LANG }, _fin);
    return; }
  if(!INDIVIDUAL){   //+AG torneo standalone 16:9: el resultado que cuenta es el del EQUIPO
    const st=teamStandings(); teamPlace=st.findIndex(s=>s.t===myTeam)+1; winnerTeam=sim.winner_team!==null?sim.winner_team:st[0].t; }
  ovState='end'; renderOverlay(); el('ov').classList.remove('hide'); }
el('ovBtn').onclick=startRound;

//+AG ARRANQUE (chassis/arranque.mjs) — SOLO EN EMBED, o sea en el juego de verdad:
//   · sustituye a la portada #ov, que en el juego era una pantalla MUERTA (un segundo "Jugar" y un selector de
//     idioma que el shell ya había resuelto en Ajustes; feedback Jaime 2026-07-26).
//   · pone el tap que desbloquea el audio ANTES de la cuenta atrás (que hasta hoy era muda siempre).
//   En standalone la portada se queda tal cual: es la herramienta de vídeo/preview y ahí sí se elige idioma.
if(EMBED){
  arranque = createArranque({
    mode:'race', lang:()=>LANG, audio, sfxOn:()=>sfxOn,
    title:()=>T().name,                     // la Carrera ya tiene su nombre en los 9 idiomas
    autoSec: TUTORIAL ? 0 : 5,              // CÓMO JUGAR: sin reloj, se entra cuando el jugador quiere
    onStart: ()=> startRound(),
  });
  banner = modeBanner({ mode:'race', lang:()=>LANG, title:()=>T().name });
  audio.prefetch();                         // la música se decodifica desde ya: en el "¡YA!" tiene que estar lista
}

buildPanels(); layout(); buildSim(seed);
if(EMBED){ const bm=el('backMenu'); if(bm) bm.style.display='none'; }   //+AG en embed el shell gestiona el volver; se oculta el "← Menu" de esquina
if(EMBED){ const ls=el('lang'); if(ls) ls.style.display='none'; }       //+AG el idioma lo manda Ajustes del shell: el selector del motor no vuelve a aparecer nunca en el juego
//+AG en un pane/iframe embebido el viewport puede medir 0 en el load inicial → re-layout al primer frame real
requestAnimationFrame(()=>{ if(innerWidth>0 && renderer.domElement.width===0) layout(); });
if(params.get('capture')==='1'){ document.getElementById('hud').style.display='none'; document.querySelector('.keys').style.display='none';
  //+AG en captura no hay jugador: se ocultan los controles/HUD de agencia y la sim corre sola (como el video)
  for(const id of ['ctr','pos','backMenu','youlbl','ov','count']) el(id).style.display='none';
  phase='play'; }
else if(arranque){ loop(); arranque.show(); }         //+AG el juego (embed): cartel del modo -> ¡LISTO! (o 5 s) -> cuenta atras
else { el('ov').classList.remove('hide'); loop(); }   //+AG standalone: portada de siempre (herramienta de video/preview)

// ============================================================================
//+AG COACH "CÓMO JUGAR" (?tutorial=1): la máquina de pasos, el foco, la mano y la pausa viven en chassis/coach.mjs
//   (compartido por los 3 modos). Aquí solo van los TEXTOS y la LISTA DE PASOS de la Carrera: qué control se
//   enseña, si el paso congela el mundo, y cómo se comprueba en la Sim que el jugador lo ha hecho de verdad.
//   El nivel sin peligro lo pone la Sim (opts.tutorial: sin aspas ni sacudidas). Sin ?tutorial=1 no se llama.
// ============================================================================
if(TUTORIAL)(function(){
  const CI={
    en:{ title:'HOW TO PLAY', sub:'Safe track: no blades, no quakes. Follow the steps and learn the controls.', exit:'✕ Exit', done:'Tutorial complete! 🎓',
      steps:[ 'Press ◀ LEFT: your ball drifts to that side',
        'Now press RIGHT ▶',
        'Press ● CENTER to fall free between the pegs',
        'Roll over a floor ARROW: it launches you down',
        'Press ⚡ NITRO: an instant burst of speed',
        'Press 🛡 SHIELD: bounce without losing your rhythm',
        'SUPER bar full, on the house! Press ⭐ SUPER',
        'That\'s it! Drop all the way to the FINISH line' ] },
    es:{ title:'CÓMO JUGAR', sub:'Pista segura: sin aspas ni sacudidas. Sigue los pasos y aprende los controles.', exit:'✕ Salir', done:'¡Tutorial completado! 🎓',
      steps:[ 'Pulsa ◀ IZQUIERDA: tu bola deriva hacia ese lado',
        'Ahora pulsa DERECHA ▶',
        'Pulsa ● CENTRO para caer libre entre los clavos',
        'Pasa por una FLECHA del suelo: te dispara hacia abajo',
        'Pulsa ⚡ NITRO: un acelerón al instante',
        'Pulsa 🛡 ESCUDO: rebotas sin perder el ritmo',
        '¡Barra de SÚPER llena de regalo! Pulsa ⭐ SÚPER',
        '¡Ya está! Baja hasta la META para terminar' ] },
  };
  //+AG doc 49: los otros 18 idiomas del tutorial llegan en el paquete. createCoach lee i18n[lang()] en
  //   cada paso, asi que basta con meter la tabla dentro del MISMO objeto CI aunque ya este en marcha.
  alLlegarPack((p,l)=>{ if(p.raceCoach) CI[l]=Object.assign({},CI.en,p.raceCoach); });
  const C=()=>CI[LANG]||CI.en;
  //+AG los pasos solo LEEN la Sim: dirección mantenida ~1s, pad de impulso (in_boost), nitro/escudo/súper activos,
  //   meta (rank). pause:true = el mundo se congela mientras lo lees (los pasos de MIRAR el juego no pausan).
  const HOLD=1.0; let acc=0;
  const held=d=> sim.player.dir===d;
  createCoach({
    mode:'race', i18n:CI, lang:()=>LANG,
    isPlaying:()=> !!sim && phase==='play',
    setPaused:v=>{ coachPaused=v; },
    //+AG si llega a meta ANTES del último paso, nueva bajada (misma seed → misma pista) y sigue donde iba
    beforeCheck:si=>{ if(sim.player.rank!==null && si<7){ startRound(); acc=0; return true; } return false; },
    steps:[
      { target:'bL',   pause:true,  check:dt=>{ acc = held(DIR.LEFT)  ? acc+dt : 0; return acc>=HOLD; } },
      { target:'bR',   pause:true,  check:dt=>{ acc = held(DIR.RIGHT) ? acc+dt : 0; return acc>=HOLD; } },
      { target:'bC',   pause:true,  check:dt=>{ acc = held(DIR.CENTER)? acc+dt : 0; return acc>=HOLD; } },
      { target:null,   pause:false, linger:0.9, check:()=> sim.player.in_boost },
      { target:'bNit', pause:true,  linger:1.4, check:()=> sim.player.turbo>0 },
      { target:'bShd', pause:true,  linger:1.4, check:()=> sim.player.shield>0 },
      { target:'bSup', pause:true,  linger:1.8, enter:()=>{ sim.super=1; }, check:()=> sim.player.star>0 },
      { target:null,   pause:false, check:()=> sim.player.rank!==null },
    ],
  });
  //+AG portada del tutorial: mismo overlay de intro del modo, con título/objetivo del coach encima
  const _rov=renderOverlay;
  renderOverlay=function(){ _rov(); if(ovState==='intro'){ el('ovTitle').textContent=C().title; el('ovSub').innerHTML=C().sub; } };
  renderOverlay();
})();
</script>
