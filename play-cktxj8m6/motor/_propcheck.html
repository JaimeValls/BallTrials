<!doctype html><meta charset="utf-8">
<title>BallTrials · banco de SILUETAS de bola-héroe (doc 41 bloque G)</title>
<!--
  Un prop solo sirve si ROMPE LA SILUETA: a 56 px, que es el tamaño real en un móvil, el color y
  el brillo se pierden y lo único que queda es el contorno. Por eso la fila de abajo es NEGRO
  SOBRE BLANCO: si dos bolas no se distinguen ahí, no se distinguen en partida.
  Uso: node prototipo/serve.mjs → /motor/_propcheck.html
-->
<style>
  body{margin:0;background:#241159;color:#eef2ff;font:14px/1.4 "Segoe UI",system-ui,sans-serif;padding:16px}
  h2{font-size:15px;margin:18px 0 8px;font-weight:700;color:#ffd23f}
  .row{display:flex;flex-wrap:wrap;gap:10px}
  .c{text-align:center}
  .c small{display:block;margin-top:4px;opacity:.75;font-size:11px}
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
               "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
</script>
<h2 id="t1"></h2><div class="row" id="big"></div>
<h2 id="t2"></h2><div class="row" id="small"></div>
<h2 id="t3"></h2><div class="row" id="sil"></div>
<script type="module">
import * as THREE from 'three';
import { ballMaterial, archLook } from './chassis/ballmat.mjs';
import { makeProp, PROP_KEYS } from './chassis/propgen.mjs';

const TEAM = [0.910, 0.212, 0.184];   // mismo color de equipo para todas: la condición real de pista
const R = 1;
// un solo renderer (con uno por celda, Chromium tira los contextos viejos y media tabla sale en blanco)
const REN = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
REN.setPixelRatio(2);
const CAM = new THREE.OrthographicCamera(-2.3, 2.3, 2.3, -2.3, 0.1, 100); CAM.position.set(0, 0, 10);
const GEO = new THREE.SphereGeometry(R, 40, 28);

function cell(key, px, silueta){
  const sc = new THREE.Scene();
  REN.setSize(px, px, false);
  REN.setClearColor(silueta ? 0xffffff : 0x1a0d45, 1);
  const mat = silueta ? new THREE.MeshBasicMaterial({ color: 0x000000 })
                      : ballMaterial(TEAM, archLook(key) || undefined);
  const g = new THREE.Group();
  g.add(new THREE.Mesh(GEO, mat));
  const p = makeProp(key, R, TEAM);
  if (p){
    if (silueta) p.traverse(o => { if (o.material) o.material = mat; });   // todo negro: solo cuenta el contorno
    g.add(p);
  }
  sc.add(g); REN.render(sc, CAM);
  const img = new Image(); img.width = img.height = px;
  img.style.cssText = 'display:block;border-radius:8px';
  img.src = REN.domElement.toDataURL();
  return img;
}
for (const [host, px, sil, title] of [
  ['big', 150, false, 'GRANDE — qué es cada prop'],
  ['small', 56, false, 'TAMAÑO DE PARTIDA (~56 px)'],
  ['sil', 56, true, 'SOLO SILUETA a 56 px — el examen de verdad']]){
  document.getElementById(host === 'big' ? 't1' : host === 'small' ? 't2' : 't3').textContent = title;
  const box = document.getElementById(host);
  for (const k of PROP_KEYS){
    const d = document.createElement('div'); d.className = 'c';
    d.appendChild(cell(k, px, sil));
    const s = document.createElement('small'); s.textContent = k; d.appendChild(s);
    box.appendChild(d);
  }
}
</script>
